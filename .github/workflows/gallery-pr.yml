name: Gallery submission check

on:
  pull_request:
    paths:
      - 'gallery/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A contributor adds or edits files under gallery/items/ only. The index,
      # its signature and everything else are the owner's to change.
      - name: Only gallery/items/** may change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          outside="$(git diff --no-renames --name-only "origin/${BASE_REF}...HEAD" | grep -v '^gallery/items/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::A gallery submission may only change files under gallery/items/. Also changed:"
            echo "$outside"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - run: npm ci --ignore-scripts

      # Same validator as the app. A stale index is a notice: the owner
      # regenerates and signs it after merging.
      - run: npm run gallery:check -- --items-only
