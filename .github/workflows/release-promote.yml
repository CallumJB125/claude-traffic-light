# Makes a staged version live, or rolls back to an older one. Run by hand:
#   Actions → Promote release → version "1.2.0"
# It publishes that version's draft GitHub Release and marks it latest (the
# feed while GitHub Releases is the update source), then points the R2 feed
# files at it. Rolling back is running this with the previous version; the
# apps accept a downgrade from the feed.
name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to make live, without the v (e.g. 1.2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a version"; exit 1; }

      - name: Publish on GitHub and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ inputs.version }}" --draft=false --latest

      - name: Point the R2 feed at it
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
        run: node scripts/release-r2.js promote "${{ inputs.version }}"
