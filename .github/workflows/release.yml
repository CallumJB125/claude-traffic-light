# Builds the Mac, Windows and Linux installers from a version tag, smoke-tests
# each packaged app, and stages the release. Nothing reaches users here:
#   - the GitHub Release is created as a DRAFT
#   - on R2 the files land under <version>/, and the feed files the apps read
#     (latest*.yml, release.json at the bucket root) are not touched
#   - release.json lists every installer's sha512 and is signed with
#     PLEXIFORM_UPDATE_SIGNING_KEY; the apps install nothing it doesn't cover
# Making a version live is release-promote.yml, run by hand. Rolling back is
# the same workflow with an older version and "rollback" ticked.
#
# Signing is off until there is a Developer ID (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ['v*.*.*']
    # Until this workflow is on main (workflow_dispatch only runs workflows on
    # the default branch), a push to this branch is the beta dry run.
    # REMOVE before merging.
    branches: ['feat/installers']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (a dry run: artifacts only, nothing staged)'
        required: true
        default: main
      beta:
        description: 'Beta: version it <version>-beta.<run>, point it at the beta feed, and upload to R2 beta/<version>/ (no GitHub Release, no feed files)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner; it builds arm64 and x64 (the native helpers are universal).
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi

      - run: npm ci

      # A beta build gets a prerelease version and looks for updates on the
      # beta feed, so beta installs never follow the stable one.
      - name: Beta version
        if: (github.event_name == 'workflow_dispatch' && inputs.beta) || github.ref == 'refs/heads/feat/installers'
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")-beta.${GITHUB_RUN_NUMBER}"
          npm version --no-git-tag-version "$v"
          echo "PLEXIFORM_UPDATE_FEED=https://download.plexiform.dev/beta" >> "$GITHUB_ENV"
          echo "beta version $v"

      # Gates tag builds only: branch and beta dry runs report failures without
      # blocking packaging and the smoke test. The ICS tests assume SAST, and
      # Electron-based tests need a display and no sandbox on Linux runners.
      - name: Unit tests
        shell: bash
        env:
          TZ: Africa/Johannesburg
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run --auto-servernum npm test; else npm test; fi
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Native helpers (Mac)
        if: matrix.platform == 'mac'
        run: npm run calendar-helper && npm run voice-helper

      - name: Build installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder -c electron-builder.config.js --${{ matrix.platform }} --publish never

      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum node scripts/smoke-installed.js

      - name: Smoke test (Mac, Windows)
        if: matrix.platform != 'linux'
        run: node scripts/smoke-installed.js

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  stage:
    name: stage (draft release + R2)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      # Installed apps refuse any release without this signature, so a tag
      # release fails here rather than staging one nobody can install.
      - name: Sign release.json
        env:
          PLEXIFORM_UPDATE_SIGNING_KEY: ${{ secrets.PLEXIFORM_UPDATE_SIGNING_KEY }}
        run: node scripts/release-sign.js build out --channel stable --version "${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Plexiform ${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md --verify-tag
          gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Upload to R2 (versioned; the live feed is untouched)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
        run: node scripts/release-r2.js stage "${GITHUB_REF_NAME#v}" out

  stage-beta:
    name: stage beta (R2 beta/<version>/ only)
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.beta) || github.ref == 'refs/heads/feat/installers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      # Signed when the key is set; otherwise a warning, and beta apps will
      # refuse this build (it still uploads, for manual testing).
      - name: Sign release.json (if the key is set)
        env:
          PLEXIFORM_UPDATE_SIGNING_KEY: ${{ secrets.PLEXIFORM_UPDATE_SIGNING_KEY }}
        run: node scripts/release-sign.js build out --channel beta --notes-file docs/release-notes.md --optional

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload to R2 beta/ (never the root feed)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
        run: |
          v="$(ls out | sed -nE 's/^Plexiform-(.+)-(mac|win|linux)-.*/\1/p' | head -1)"
          echo "version $v"
          node scripts/release-r2.js stage-beta "$v" out
