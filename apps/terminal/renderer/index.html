<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Plexiform Terminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script defer src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Sessions">
      <div class="sidebar-top drag">
        <span id="development" class="dev-pill" title="Development build for local testing. Not signed or notarized for public release." hidden>Preview</span>
      </div>
      <div class="sidebar-nav">
        <button id="quick-open" class="jump"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2 13.5 13.5"/></svg><span>Jump to session…</span><kbd>⌘P</kbd></button>
        <button id="nav-overview" class="nav-item"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h7M2.5 8h11M2.5 12h5"/></svg><span>Overview</span><span id="overview-count" class="nav-count"></span><kbd>⌘0</kbd></button>
        <button id="next-needs" class="nav-item needs-jump" hidden><span class="ind" data-s="needs" aria-hidden="true"></span><span id="next-needs-label">Next waiting</span><kbd>⌘J</kbd></button>
      </div>
      <nav id="session-list" class="session-list" aria-label="Sessions"></nav>
      <div class="sidebar-foot">
        <div class="launch" role="group" aria-label="Start a session">
          <button data-spawn="shell" title="New shell in the current session's folder (⌘T)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>Shell</button>
          <button data-spawn="claude" title="Start Claude Code in the current session's folder">Claude</button>
          <button data-spawn="codex" title="Start Codex in the current session's folder">Codex</button>
        </div>
        <div class="keeper-state"><span id="keeper-dot" class="keeper-dot" aria-hidden="true"></span><span id="keeper-state">Connecting to Session Keeper…</span><button id="reconnect" class="link" hidden>Reconnect</button></div>
        <div id="bus-state" class="keeper-state" hidden><span id="bus-dot" class="keeper-dot" aria-hidden="true"></span><span id="bus-text"></span></div>
      </div>
    </aside>

    <main class="main">
      <section id="overview-view" class="view overview" aria-label="Overview of all sessions">
        <header class="view-head drag">
          <div class="head-text"><h1>Overview</h1><p id="overview-summary" class="sub"></p></div>
          <div class="range" role="group" aria-label="Time range">
            <button data-range="15" aria-pressed="false">15m</button><button data-range="30" aria-pressed="true">30m</button><button data-range="60" aria-pressed="false">60m</button>
          </div>
        </header>
        <div id="stats" class="stats" aria-label="Totals"></div>
        <div class="overview-body">
          <div class="scroll lanes-scroll">
            <div id="lanes" class="lanes" role="table" aria-label="Sessions over time"></div>
            <div id="lanes-legend" class="legend"></div>
          </div>
          <aside class="overview-side scroll" aria-label="Needs you and hand-offs">
            <section class="block">
              <div class="block-head"><h2 class="label">Needs you</h2><span id="queue-count" class="count"></span></div>
              <div id="queue" class="queue"></div>
            </section>
            <section class="block">
              <div class="block-head"><h2 class="label">Hand-offs</h2><span id="handoff-count" class="count"></span></div>
              <div id="handoffs" class="handoff-list"></div>
            </section>
          </aside>
        </div>
      </section>

      <section id="session-view" class="view session-view" aria-label="Session" hidden>
        <header class="view-head drag session-bar">
          <div class="session-title">
            <span id="session-ind" class="ind" aria-hidden="true"></span>
            <div class="session-text">
              <div class="session-line"><strong id="session-project"></strong><span id="session-ext" class="chip" hidden>Read-only</span></div>
              <div id="session-sub" class="session-sub"></div>
            </div>
          </div>
          <div id="session-chips" class="session-chips"></div>
          <div class="session-actions"><button id="detach" title="Hide this terminal and keep its process running">Detach</button><button id="stop" class="danger" title="End this terminal's process">Stop…</button></div>
        </header>
        <div class="session-body">
          <div id="terminal-view" class="pane terminal-pane" hidden>
            <div class="terminal-frame"><div id="terminal" role="region" aria-label="Terminal output" hidden></div></div>
          </div>
          <div id="detail-view" class="pane detail-pane scroll" hidden><div id="detail-body" class="detail-page"></div></div>
          <aside id="rail" class="rail scroll" aria-label="Agents in this session"></aside>
        </div>
        <footer id="statusline" class="statusline" aria-label="Session status"></footer>
      </section>
    </main>
  </div>

  <div id="palette" class="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Jump to a session">
      <input id="palette-input" type="text" placeholder="Jump to a session, project or branch…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list">
      <div id="palette-list" class="palette-list" role="listbox" aria-label="Sessions and actions"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="dismiss-notice" aria-label="Dismiss notice">×</button></div>
</body>
</html>
