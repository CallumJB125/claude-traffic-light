<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2630"/>
      <stop offset="1" stop-color="#17151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#2fae3e" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#2fae3e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2fae3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="lampglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <path d="M512 100c258 0 412 0 412 412s-154 412-412 412S100 770 100 512 254 100 512 100z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <ellipse cx="512" cy="812" rx="300" ry="42" fill="url(#floor)"/>
  </g>

  <!-- rig: the widget's 64x82 geometry scaled x11, centred and nudged up -->
  <g transform="translate(160 118) scale(11)" shape-rendering="crispEdges">
    <!-- sign -->
    <rect x="4" y="24" width="56" height="5" fill="#726c62"/>
    <rect x="7" y="7" width="15" height="15" rx="2.5" fill="#3a3542"/>
    <rect x="24.5" y="7" width="15" height="15" rx="2.5" fill="#3a3542"/>
    <rect x="42" y="7" width="15" height="15" rx="2.5" fill="#2fae3e" filter="url(#lampglow)"/>
    <rect x="42" y="7" width="15" height="15" rx="2.5" fill="#2fae3e"/>
    <rect x="0" y="29" width="9" height="10" fill="#da7756"/>
    <!-- claude -->
    <g fill="#da7756">
      <rect x="17" y="39" width="30" height="13"/>
      <rect x="4" y="52" width="56" height="7"/>
      <rect x="15" y="59" width="7" height="9"/>
      <rect x="28.5" y="59" width="7" height="9"/>
      <rect x="42" y="59" width="7" height="9"/>
    </g>
    <rect x="22" y="43.5" width="4.5" height="4.5" fill="#211f1c"/>
    <rect x="37.5" y="43.5" width="4.5" height="4.5" fill="#211f1c"/>
    <!-- thinking dots -->
    <circle cx="24" cy="34" r="2" fill="#f2efe8" stroke="#211f1c" stroke-width="0.6" opacity="0.35"/>
    <circle cx="32" cy="34" r="2" fill="#f2efe8" stroke="#211f1c" stroke-width="0.6" opacity="0.7"/>
    <circle cx="40" cy="34" r="2" fill="#f2efe8" stroke="#211f1c" stroke-width="0.6"/>
  </g>
</svg>
