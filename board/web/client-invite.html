<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Client invitation · Plexiform</title>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/app.css">
  <script type="module" src="/web/js/client-invite.js"></script>
</head>
<body><div class="app app-center"><main class="signin" aria-labelledby="client-invite-title">
  <h1 id="client-invite-title">Your client project invitation</h1>
  <p id="client-invite-lead" role="status">Checking your invitation…</p>
  <button id="client-join" class="btn btn-primary" type="button" hidden>Accept invitation</button>
  <a id="client-signin" class="btn btn-primary" href="/signin" hidden>Sign in to accept</a>
  <button id="client-switch" class="btn" type="button" hidden>Sign in with the invited email</button>
  <p><a class="btn" href="/clients">Open my shared projects</a></p>
</main></div></body>
</html>
