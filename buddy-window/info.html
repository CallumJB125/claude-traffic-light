<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>Buddy</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="shell.css">
  <script src="info.js" defer></script>
</head>
<body class="info-body">
  <main class="info" id="info">
    <div class="info-drag" aria-hidden="true"></div>
    <span class="info-mark" aria-hidden="true"></span>
    <h1 id="title"></h1>
    <p id="blurb"></p>
    <p id="badge" class="info-badge"></p>
    <button type="button" class="btn" id="retry" hidden>Try again</button>
    <form class="connect" id="connect" hidden>
      <label class="field"><span>Team hub address</span>
        <input class="input" name="url" type="text" inputmode="url" autocomplete="url" placeholder="buddy.example.com" required autofocus spellcheck="false"></label>
      <label class="field"><span>Name in the sidebar <em>(optional)</em></span>
        <input class="input" name="name" type="text" placeholder="e.g. Bondly team" maxlength="60"></label>
      <p class="connect-error" id="connect-error" role="alert"></p>
      <button type="submit" class="btn btn-primary" id="connect-go">Connect</button>
      <p class="connect-note">Next you’ll sign in with your work email. You’ll get a one-time code; nothing opens in a browser.</p>
    </form>
  </main>
</body>
</html>
