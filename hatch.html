<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Hatch a character</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="rig.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--text-base)/1.4 var(--font); -webkit-font-smoothing: antialiased; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--space-5); padding: var(--space-5); height: 100%; }
  h1 { margin: 0 0 var(--space-3); font-size: var(--text-lg); font-weight: 600; }
  form { display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; padding-right: var(--space-2); }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend, label.lbl { display: block; font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-1); padding: 0; }
  input[type="text"], textarea { width: 100%; padding: var(--space-2) var(--space-3); background: var(--surface, rgba(255,255,255,.06)); color: var(--text); border: 1px solid var(--line-strong); border-radius: var(--radius-md, 8px); font: inherit; }
  textarea { min-height: 3.4em; resize: vertical; }
  textarea:disabled { opacity: .55; }
  .hint { margin: var(--space-1) 0 0; font-size: var(--text-sm); color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg span { display: inline-block; padding: var(--space-1) var(--space-3); border: 1px solid var(--line-strong); border-radius: 999px; font-size: var(--text-sm); text-transform: capitalize; }
  .seg input:checked + span { background: var(--accent); color: var(--on-accent, #15171c); border-color: var(--accent); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: var(--space-3); }
  input[type="color"] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--line-strong); border-radius: var(--radius-md, 8px); background: none; }
  button { font: inherit; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md, 8px); border: 1px solid var(--line-strong); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-accent, #15171c); border-color: var(--accent); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  aside { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  #stage { width: 240px; height: 308px; border-radius: var(--radius-lg); background: radial-gradient(120% 90% at 50% 105%, #26222d, #121014 75%); display: grid; place-items: center; }
  #stage svg.rig { width: 192px; height: 246px; }
  #status { min-height: 1.4em; margin: 0; text-align: center; font-size: var(--text-sm); color: var(--muted); }
  #status.ok { color: var(--ok, #2fae3e); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <form id="form" autocomplete="off">
    <h1>Hatch a character</h1>
    <div><label class="lbl" for="name">Name</label><input type="text" id="name" maxlength="24" value="Hatchling" /></div>
    <div>
      <label class="lbl" for="desc">Describe it</label>
      <textarea id="desc" maxlength="160" placeholder="a sleepy otter who loves coffee" disabled></textarea>
      <p class="hint" id="desc-hint">Describing a character needs an AI, and none is connected yet. Pick a look below.</p>
    </div>
    <fieldset><legend>Shape</legend><div class="seg" id="shape"></div></fieldset>
    <fieldset><legend>Size</legend><div class="seg" id="size"></div></fieldset>
    <fieldset><legend>Arms</legend><div class="seg" id="arms"></div></fieldset>
    <fieldset><legend>Accessory</legend><div class="seg" id="accessory"></div></fieldset>
    <div class="row"><label class="lbl" for="color" style="margin:0">Colour</label><input type="color" id="color" value="#e0885f" /><button type="button" id="surprise">Surprise me</button></div>
    <div class="row"><button type="submit" class="primary" id="save">Save character</button><button type="button" id="close">Close</button></div>
  </form>
  <aside>
    <div id="stage" role="img" aria-label="A live preview of your character"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </aside>
</main>
<script src="motion.js"></script>
<script src="characters/contract.js"></script>
<script src="characters/builtin/core.js"></script>
<script src="characters/builtin/wave2.js"></script>
<script src="characters/builtin/starter.js"></script>
<script src="rig.js"></script>
<script src="hatch-view.js"></script>
</body>
</html>
