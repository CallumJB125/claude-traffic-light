<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Claude Buddy</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="rig.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* The outer strip is plain (non-drag) window chrome so macOS can grab the
     true window edge to resize by dragging. */
  body {
    box-sizing: border-box;
    padding: 12px;
  }

  /* Deliberately NOT -webkit-app-region: drag — on macOS that swallows plain
     clicks. Dragging is done manually in JS so clicks keep working. */
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .housing {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #tooltip {
    position: fixed;
    left: 50%;
    bottom: -26px;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 3px 8px;
    border-radius: var(--radius);
    background: rgba(20, 20, 22, 0.92);
    font: 500 10px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  #app:hover #tooltip { opacity: 1; }

  /* Hover gear → Lights, so the editor is discoverable from the widget. */
  #gear { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(20, 20, 22, 0.85); color: var(--text); display: grid; place-items: center; opacity: 0; transition: opacity 120ms ease; cursor: pointer; padding: 0; }
  #gear svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
  body:hover #gear, #gear:focus-visible { opacity: 1; }
  #gear:hover { background: var(--accent); color: var(--accent-ink); }
  /* Hover ? → what everything on screen means right now. */
  #help { position: absolute; top: 2px; right: 22px; width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(20, 20, 22, 0.85); color: var(--text); font: 700 11px -apple-system, system-ui, sans-serif; line-height: 18px; text-align: center; opacity: 0; transition: opacity 120ms ease; cursor: pointer; padding: 0; }
  body:hover #help, #help:focus-visible { opacity: 1; }
  #help:hover { background: var(--accent); color: var(--accent-ink); }

  /* Allow / Deny strip, shown while a permission request waits. */
  #ask { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; padding: 0 6px 4px; gap: 4px; align-items: center; flex-wrap: wrap; align-content: flex-end; }
  body.asking #ask { display: flex; }
  /* Nobody can see the widget: finite animations mid-flight hold too. */
  body.motion-paused * { animation-play-state: paused !important; }
  body.asking #app { height: calc(100% - 46px); }
  #ask button { flex: 1; height: 22px; border: none; border-radius: var(--radius); font: 600 10px -apple-system, system-ui, sans-serif; cursor: pointer; color: #fff; }
  #ask .allow { background: var(--green); }
  #ask .deny { background: var(--danger); }
  #ask button:active { transform: scale(0.96); }

  /* "While you were away": what happened during a meeting or Focus, shown
     once it ends. Each row jumps to that session's terminal. */
  #away { display: none; position: absolute; left: 4px; right: 4px; bottom: 2px; height: 60px; box-sizing: border-box; padding: 3px 5px; border-radius: var(--radius); background: rgba(20, 20, 22, 0.92); color: rgba(255, 255, 255, 0.92); font: 500 9px/1.25 -apple-system, system-ui, sans-serif; flex-direction: column; gap: 1px; overflow: hidden; }
  body.away:not(.asking) #away { display: flex; }
  body.away:not(.asking) #app { height: calc(100% - 64px); }
  #away .head { display: flex; align-items: center; gap: 4px; font-weight: 700; color: var(--accent); }
  #away .head span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #away .x { border: none; background: none; color: inherit; font: 700 10px -apple-system, system-ui, sans-serif; padding: 0 2px; cursor: pointer; opacity: 0.7; }
  #away .x:hover { opacity: 1; }
  #away .row { display: flex; align-items: center; gap: 4px; border: none; background: none; color: inherit; font: inherit; text-align: left; padding: 0; cursor: pointer; min-width: 0; }
  #away .row:hover { color: #fff; text-decoration: underline; }
  #away .row .dot { flex: none; width: 6px; height: 6px; border-radius: 2px; background: var(--idle); }
  #away .row.needs-you .dot { background: var(--red); }
  #away .row.failed .dot { background: var(--amber); }
  #away .row.done .dot { background: var(--green); }
  #away .row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #away .more { opacity: 0.65; }
  #away .row.held { cursor: default; opacity: 0.8; }
  #away .row.held:hover { text-decoration: none; color: inherit; }
  /* "Update ready": quiet on purpose (no red, no blinking). The ask and the
     recap both outrank it, so it only shows when neither does. */
  #update { display: none; position: absolute; left: 4px; right: 4px; bottom: 2px; height: 68px; box-sizing: border-box; padding: 4px 6px; border-radius: var(--radius); background: rgba(20, 20, 22, 0.92); color: rgba(255, 255, 255, 0.92); font: 500 9px/1.25 -apple-system, system-ui, sans-serif; flex-direction: column; gap: 2px; overflow: hidden; }
  body.updating:not(.asking):not(.away) #update { display: flex; }
  body.updating:not(.asking):not(.away) #app { height: calc(100% - 72px); }
  #update .text { font-weight: 700; color: var(--text); }
  #update.ready .text { color: var(--accent); }
  #update .sub { opacity: 0.7; }
  #update .acts { margin-top: auto; display: flex; gap: 4px; }
  #update button { height: 18px; padding: 0 8px; border: none; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); font: 600 9px -apple-system, system-ui, sans-serif; cursor: pointer; }
  #update button.later { background: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.85); font-weight: 500; }
  #update button:active { transform: scale(0.96); }
  /* Push-to-talk: a red mic badge for as long as the mic is open, so
     listening is never covert. It stays put under reduced motion. */
  #mic { display: none; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; place-items: center; pointer-events: none; box-shadow: 0 0 0 0 rgba(226, 35, 26, 0.55); }
  #mic svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  body.listening #mic { display: grid; animation: mic-ring 1.2s ease-out infinite; }
  @keyframes mic-ring { from { box-shadow: 0 0 0 0 rgba(226, 35, 26, 0.55); } to { box-shadow: 0 0 0 7px rgba(226, 35, 26, 0); } }
  @media (prefers-reduced-motion: reduce) { body.listening #mic { animation: none; box-shadow: 0 0 0 2px rgba(226, 35, 26, 0.35); } }
  /* What is being approved: one line, with an explicit "+N more", and a
     click-to-open panel with all of it (scrollable). */
  #ask-what { display: flex; width: 100%; font: 9px/12px ui-monospace, Menlo, monospace; color: var(--text); white-space: nowrap; cursor: pointer; }
  #ask-what .head { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #ask-what .more { flex: none; padding-left: 3px; color: var(--accent); }
  #ask-full { display: none; position: absolute; left: 4px; right: 4px; top: 4px; bottom: 50px; z-index: 5; margin: 0; padding: 6px; overflow: auto; border-radius: var(--radius); background: rgba(20, 20, 22, 0.96); color: var(--text); font: 9px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  body.asking.ask-open #ask-full { display: block; }
</style>
</head>
<body>
  <div id="app" title="">
    <div class="housing" id="housing"></div>
    <div id="tooltip"></div>
  </div>
  <button id="gear" title="Lights — program what Claude does (right-click the widget also works)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></button>
  <button id="help" title="What does this mean?">?</button>
  <div id="mic" role="status" aria-label="Listening" title="Listening — let go to ask"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.3 7.8a4.7 4.7 0 0 0 9.4 0M8 12.5v2"/></svg></div>
  <pre id="ask-full"></pre>
  <div id="ask">
    <div id="ask-what" title="Click to see exactly what you are approving"></div>
    <button class="allow" id="allow" title="Allow this tool call">Allow</button>
    <button class="deny" id="deny" title="Deny this tool call">Deny</button>
  </div>
  <div id="away" role="status" aria-live="polite" aria-label="While you were away">
    <div class="head"><span id="away-head">While you were away</span><button class="x" id="away-x" title="Dismiss" aria-label="Dismiss">×</button></div>
    <div id="away-rows"></div>
  </div>

  <div id="update" role="status" aria-live="polite">
    <div class="text" id="update-text"></div>
    <div class="sub" id="update-sub"></div>
    <div class="acts"><button id="update-btn" type="button"></button><button id="update-later" class="later" type="button" title="Hide this until something changes; the tray keeps the update">Later</button></div>
  </div>

  <script src="brand.js"></script>
  <script src="src/update-view.js"></script>
  <script src="motion.js"></script>
  <script src="characters/contract.js"></script>
  <script src="characters/builtin/core.js"></script>
  <script src="rig.js"></script>
  <script>
    // ambient: the idle loops tick on a slow clock, not every display frame
    const rig = mountRig(document.getElementById('housing'), { ambient: true });
    rig.svg.classList.add('breathes');
    // Main does the window travel (roam, knock hops, garden, drag glide), so
    // it has to hear about reduced motion from here, now and on every change.
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    window.trafficLight.setReducedMotion(reducedMotion.matches);
    rig.blinks(!reducedMotion.matches);
    reducedMotion.addEventListener('change', (e) => {
      window.trafficLight.setReducedMotion(e.matches);
      rig.blinks(!e.matches);
      if (e.matches) rig.lookAt(0, 0);
    });
    const kick = () => window.BuddyMotion.MOTION.pendulum.kick;
    window.trafficLight.onLand((strength) => { rig.squash(strength); rig.swing(kick() * strength); retestUnderCursor().catch(() => {}); });
    // A glide hit a work-area edge: squash against that wall; the sign carries
    // on toward it and swings back.
    window.trafficLight.onImpact((side, strength) => {
      rig.squash(strength, side);
      rig.swing(kick() * 1.5 * strength * (side === 'left' || side === 'top' ? -1 : 1));
    });
    window.trafficLight.onSway((v) => rig.swing(v));
    window.trafficLight.onLean((vx) => rig.lean(vx));
    window.trafficLight.onEyes((x, y) => rig.lookAt(x, y));
    let motionPaused = false;
    window.trafficLight.onMotionPaused((paused) => {
      motionPaused = !!paused;
      document.body.classList.toggle('motion-paused', motionPaused);
      rig.setHidden(motionPaused);
    });
    const tooltip = document.getElementById('tooltip');
    const app = document.getElementById('app');

    let lastRuleId = null;
    // The agents roster is a hover reveal, so it never covers Claude at rest.
    let hovering = false;
    app.addEventListener('mouseenter', () => { hovering = true; if (rig.look) rig.setLook({ ...rig.look, showRoster: rig.look.agentRoster !== false }); });
    app.addEventListener('mouseleave', () => { hovering = false; if (rig.look) rig.setLook({ ...rig.look, showRoster: false }); });
    let sleepSince = null;
    // when the current cigarette run started; the rig counts its 5-minute cigarettes from it
    let smokeSince = null;
    let currentRequest = null;
    const answerBtns = ['allow', 'deny'].map((id) => document.getElementById(id));
    let confettiTimer = null;
    const GRUMPY_AFTER_MS = 3 * 60 * 1000;
    const TOOLTIP_MAX = 90;

    // Status pushes can overlap; only the newest fetch may paint, and one bad
    // frame must not leave the widget frozen on a stale pose.
    let refreshSeq = 0;
    async function refresh() {
      const seq = ++refreshSeq;
      try {
        const data = await window.trafficLight.getAggregateStatus();
        if (seq !== refreshSeq || !data) return;
        applyStatus(data);
      } catch (err) {
        console.error('[refresh]', err);
        if (seq !== refreshSeq) return;
        try { rig.setLook({ ...(rig.look || {}), lamp: 'off', pose: 'none' }); } catch (e2) { console.error('[refresh] safe look failed', e2); }
      }
    }
    // Text only (textContent): request content is untrusted.
    function renderAsk(req) {
      const v = req.view || { tool: req.tool, headline: req.summary || '', moreChars: 0, detail: req.summary || '', detailCutChars: 0, cwd: req.cwd || '' };
      const what = document.getElementById('ask-what');
      const head = document.createElement('span');
      head.className = 'head';
      head.textContent = `${v.tool}: ${v.headline}`;
      what.replaceChildren(head);
      const more = document.createElement('span');
      more.className = 'more';
      more.textContent = v.moreChars ? `+${v.moreChars} chars ▸` : 'all ▸';
      what.appendChild(more);
      document.getElementById('ask-full').textContent = `${v.tool}${v.cwd ? `  in ${v.cwd}` : ''}\n\n${v.detail}${v.detailCutChars ? `\n\n… ${v.detailCutChars} more characters not shown here. Check the terminal before allowing.` : ''}`;
    }
    document.getElementById('ask-what').addEventListener('click', () => document.body.classList.toggle('ask-open'));

    function applyStatus(data) {
      const look = { ...data.look, ...(data.look.pose === 'ak47' || data.look.pose === 'sniper' ? aim : {}), showRoster: hovering && data.look.agentRoster !== false };
      sleepSince = look.pose === 'sleep' ? (sleepSince ?? Date.now()) : null;
      look.grumpy = sleepSince !== null && Date.now() - sleepSince > GRUMPY_AFTER_MS;
      smokeSince = look.pose === 'smoke' ? (smokeSince ?? Date.now()) : null;
      if (smokeSince) look.smokeSince = smokeSince;
      rig.setLook(look);
      // Permission request strip
      const req = data.pending && data.pending[0];
      document.body.classList.toggle('asking', !!req && data.reason !== 'travel');
      if (req) {
        if (!currentRequest || currentRequest.id !== req.id) { answerBtns.forEach((b) => { b.disabled = false; }); document.body.classList.remove('ask-open'); }
        currentRequest = req;
        renderAsk(req);
      } else { currentRequest = null; document.body.classList.remove('ask-open'); }
      renderAway(data.reason === 'travel' ? null : data.away);
      // Confetti fires on entering a celebrating state, then again every 10s
      // for as long as that state holds.
      if (look.celebrate && look.ruleId !== lastRuleId) {
        rig.celebrate();
        clearInterval(confettiTimer);
        confettiTimer = setInterval(() => { if (!motionPaused) rig.celebrate(); }, 10000);
      } else if (!look.celebrate) {
        clearInterval(confettiTimer);
        confettiTimer = null;
      }
      lastRuleId = look.ruleId;

      const count = data.sessions?.length || 0;
      const agents = data.agentCount || 0;
      const suffix = data.reason === 'manual'
        ? ' (manual override)'
        : data.reason === 'preview'
          ? ' (preview)'
          : count
            ? ` — ${count} session${count === 1 ? '' : 's'}${agents ? ` · ${agents} agent${agents === 1 ? '' : 's'}` : ''}`
            : ' (no active sessions)';
      // Lamp owner first (the real state), then the tool, then the accents
      // layered on top — dropped with '…' once the line gets too long.
      const names = data.firedNames?.length ? data.firedNames : [look.name || 'Claude Traffic Light'];
      // F1 spend: the spend rule's name carries its burn rate or budget line.
      const note = (n) => (data.spendNote && n === data.spendNote.rule ? `${n} (${data.spendNote.text})` : n);
      let text = note(names[0]) + (data.tool ? ` · ${data.tool}` : '');
      for (const n0 of names.slice(1)) {
        const n = note(n0);
        if (`${text} · ${n} · …`.length + suffix.length > TOOLTIP_MAX) { text += ' · …'; break; }
        text += ` · ${n}`;
      }
      // Usage history: today against your own usual, when it is clearly above.
      tooltip.textContent = text + suffix + (data.paceLine ? ` — ${data.paceLine}` : '');
    }

    // In-app update row. Text only (textContent): a hub name is not ours.
    // `armed`: "when you're not working" was asked for; `dismissedFor`: the state
    // the person said "Later" to, so the next change brings the row back.
    let updateRow = null;
    let updateState = null;
    let armed = false;
    let dismissedFor = null;
    const updateKey = (s) => JSON.stringify([s.status, s.available && s.available.version, s.requiredByHub, s.installKind, s.error && s.error.code]);
    function renderUpdate(state) {
      if (state && updateState && updateKey(state) !== updateKey(updateState)) { armed = false; dismissedFor = null; }
      updateState = state;
      updateRow = state && dismissedFor !== updateKey(state) ? window.UpdateView.widgetRow(state, { name: window.Brand.name, armed }) : null;
      const box = document.getElementById('update');
      box.className = updateRow ? updateRow.kind : '';
      if (updateRow) {
        document.getElementById('update-text').textContent = updateRow.text;
        document.getElementById('update-sub').textContent = updateRow.sub || '';
        const b = document.getElementById('update-btn');
        b.hidden = !updateRow.button;
        b.textContent = updateRow.button ? updateRow.button.label : '';
      }
      document.body.classList.toggle('updating', !!updateRow);
      window.trafficLight.updateRowShown(!!updateRow);
    }
    const stop = (e) => e.stopPropagation();
    for (const id of ['update-btn', 'update-later']) document.getElementById(id).addEventListener('mousedown', stop);
    document.getElementById('update-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = updateRow && updateRow.button && updateRow.button.id;
      if (id === 'open-updates') { window.trafficLight.openUpdates(); return; }
      const when = id === 'install-now' ? 'now' : id === 'install-idle' ? 'idle' : null;
      if (!when) return;
      const r = await window.trafficLight.updaterInstall(when).catch(() => null);
      // A session is working: the team board still needs this, so wait for a quiet moment instead of interrupting.
      if (r && r.deferred && when === 'now') { await window.trafficLight.updaterInstall('idle').catch(() => null); armed = true; }
      if (when === 'idle' && r && r.ok !== false) armed = true;
      renderUpdate(updateState);
    });
    document.getElementById('update-later').addEventListener('click', (e) => {
      e.stopPropagation();
      if (updateState) { dismissedFor = updateKey(updateState); renderUpdate(updateState); }
    });
    window.trafficLight.onUpdaterState(renderUpdate);
    window.trafficLight.getUpdaterState().then((s) => { if (s && s.status) renderUpdate(s); }).catch(() => {});

    // The recap: needs-you first, then failures, then finished. Three lines
    // fit under the heading; past three items the last becomes "+N more".
    const AWAY_LINES = 3;
    const AWAY_WORDS = { 'needs-you': (x) => x.detail || 'needs you', failed: (x) => `failed${x.detail && x.detail !== 'error' ? ` (${x.detail})` : ''}`, done: () => 'done' };
    let awayKey = null;
    function renderAway(recap) {
      document.body.classList.toggle('away', !!recap);
      const key = recap ? `${recap.to}` : null;
      if (key === awayKey) return;
      awayKey = key;
      const rows = document.getElementById('away-rows');
      if (!recap) { rows.replaceChildren(); return; }
      document.getElementById('away-head').textContent = 'While you were away';
      document.getElementById('away-head').title = `${recap.headline}${recap.reasons && recap.reasons.length ? ` — while busy (${recap.reasons.join(', ')})` : ''}`;
      // Held pings take the last line when there were any.
      const room = AWAY_LINES - (recap.held ? 1 : 0);
      const shown = recap.items.length > room ? room - 1 : recap.items.length;
      const els = recap.items.slice(0, shown).map((x, i) => {
        const b = document.createElement('button');
        b.className = `row ${x.kind}`;
        b.title = `${x.folder || 'session'}: ${AWAY_WORDS[x.kind](x)} — click to go there`;
        const dot = document.createElement('i');
        dot.className = 'dot';
        const text = document.createElement('span');
        text.textContent = `${x.folder || 'session'} · ${AWAY_WORDS[x.kind](x)}`;
        b.append(dot, text);
        b.addEventListener('mousedown', (e) => e.stopPropagation());
        b.addEventListener('click', async (e) => { e.stopPropagation(); const r = await window.trafficLight.awayOpen(i); if (r && r.folder) showFeedback(`→ ${r.folder} · path copied`); });
        return b;
      });
      const extra = recap.items.length - shown;
      if (extra > 0) { const m = document.createElement('div'); m.className = 'more'; m.textContent = `+${extra} more`; els.push(m); }
      if (recap.held) {
        const h = document.createElement('div');
        h.className = 'row held';
        const list = (recap.heldPings || []).map((p) => `${p.rule}${p.count > 1 ? ` ×${p.count}` : ''}`);
        h.title = `Held while you were busy: ${list.join(', ')}`;
        const dot = document.createElement('i');
        dot.className = 'dot';
        const text = document.createElement('span');
        text.textContent = `${recap.held} held${list.length ? ` · ${list.join(', ')}` : ''}`;
        h.append(dot, text);
        els.push(h);
      }
      rows.replaceChildren(...els);
    }
    document.getElementById('away-x').addEventListener('mousedown', (e) => e.stopPropagation());
    document.getElementById('away-x').addEventListener('click', (e) => { e.stopPropagation(); window.trafficLight.awayDismiss(); });

    refresh();
    window.trafficLight.onStatusChanged(refresh);
    window.trafficLight.onBurst((ms) => rig.burst(ms));
    // Aim updates arrive ~8x/s while a gun pose is live; re-apply the current
    // look with the new facing/angle without waiting for the next poll.
    let aim = { facing: 'right', aimAngle: 0 };
    window.trafficLight.onAim((a) => { aim = a; if (rig.look) rig.setLook({ ...rig.look, ...aim }); });

    // Dragging: the window's top-left is always the cursor minus where it
    // grabbed (clientX/Y), so nothing waits on IPC and the first move lands.
    // Moves coalesce to one IPC per frame; the release velocity hands off to
    // a momentum glide in main.
    let drag = null;
    let didDrag = false;
    let dragFrame = 0;
    let dragTo = null;
    const flushDrag = () => {
      dragFrame = 0;
      if (dragTo) { window.trafficLight.setWindowPosition(dragTo.x, dragTo.y); dragTo = null; }
    };

    // Press and hold (without moving) = ask a question out loud; letting go
    // sends it. The release is not also a click.
    const LONG_PRESS_MS = 650;
    // Known up front, so a hold where voice can't work stays a plain click.
    let longPressOn = false;
    const syncVoice = () => window.trafficLight.voiceEnabled().then((on) => { longPressOn = !!on; }).catch(() => { longPressOn = false; });
    syncVoice();
    window.trafficLight.onStatusChanged(syncVoice);
    let pressTimer = 0;
    let pressTalking = false;
    let swallowClick = false;
    const endPress = () => {
      clearTimeout(pressTimer);
      pressTimer = 0;
      if (!pressTalking) return;
      pressTalking = false;
      swallowClick = true;
      window.trafficLight.voiceStop();
    };
    app.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      clearTimeout(pressTimer);
      if (longPressOn) pressTimer = setTimeout(() => {
        pressTimer = 0;
        if (!drag || didDrag) return;
        pressTalking = true;
        window.trafficLight.voiceStart().then((r) => { if (r && r.ok) drag = null; else pressTalking = false; }).catch(() => { pressTalking = false; });
      }, LONG_PRESS_MS);
      drag = { grabX: e.clientX, grabY: e.clientY, startX: e.screenX, startY: e.screenY, samples: [{ x: e.screenX, y: e.screenY, t: e.timeStamp }] };
      didDrag = false;
      window.trafficLight.dragStart();
      rig.squash(0.6);
    });
    // While dragging, the sign trails the pointer's velocity; when the pointer
    // pauses (no more moves arrive) it swings back upright.
    let leanTimer = 0;
    const dragLean = (vx) => {
      rig.lean(vx);
      clearTimeout(leanTimer);
      leanTimer = vx ? setTimeout(() => rig.lean(0), 70) : 0;
    };

    // Only what is actually drawn should catch the mouse: over the empty
    // corners of the transparent window, clicks fall through to whatever is
    // behind. The hit test runs on every move; the IPC only fires on change.
    let clickThrough = null;
    const solidAt = (x, y) => {
      const el = document.elementFromPoint(x, y);
      if (!el) return false;
      if (el.closest('#gear, #help, #ask, #ask-full, #away, #update, .minion')) return true;
      return rig.solidAt(x, y);
    };
    const hitTest = (x, y) => {
      const ignore = !solidAt(x, y);
      if (ignore !== clickThrough) { clickThrough = ignore; window.trafficLight.setClickThrough(ignore); }
    };
    window.addEventListener('mousemove', (e) => {
      if (drag) return;
      hitTest(e.clientX, e.clientY);
    });
    window.trafficLight.onHitTest((x, y) => { if (!drag) hitTest(x, y); });
    // A glide can land under a cursor that never moves, so no mousemove comes.
    const retestUnderCursor = async () => {
      if (drag) return;
      const pt = await window.trafficLight.cursorInWindow();
      if (pt) hitTest(pt.x, pt.y);
    };

    window.addEventListener('mousemove', (e) => {
      if (!drag) return;
      if (e.buttons !== 1) { endDrag(e, false); return; }
      if (Math.abs(e.screenX - drag.startX) > 3 || Math.abs(e.screenY - drag.startY) > 3) didDrag = true;
      if (!didDrag) return;
      drag.samples.push({ x: e.screenX, y: e.screenY, t: e.timeStamp });
      if (drag.samples.length > 12) drag.samples.shift();
      dragTo = { x: e.screenX - drag.grabX, y: e.screenY - drag.grabY };
      if (!dragFrame) dragFrame = requestAnimationFrame(flushDrag);
      dragLean(window.BuddyMotion.releaseVelocity(drag.samples, e.timeStamp).vx);
    });

    // A click (no drag) never glides; a drag throws with whatever velocity
    // the pointer still had when it let go.
    function endDrag(e, released) {
      const d = drag;
      drag = null;
      if (!d || !didDrag) return;
      dragLean(0);
      if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }
      if (released) d.samples.push({ x: e.screenX, y: e.screenY, t: e.timeStamp });
      const x = e.screenX - d.grabX;
      const y = e.screenY - d.grabY;
      window.trafficLight.setWindowPosition(x, y);
      dragTo = null;
      const v = window.BuddyMotion.releaseVelocity(d.samples, e.timeStamp);
      window.trafficLight.dragEnd(released ? v.vx : 0, released ? v.vy : 0);
    }
    window.addEventListener('mouseup', (e) => { endPress(); endDrag(e, true); });

    let wheelAccum = 0;
    app.addEventListener('wheel', (e) => {
      e.preventDefault();
      wheelAccum += e.deltaY;
      if (Math.abs(wheelAccum) < 12) return;
      const factor = wheelAccum < 0 ? 1.06 : 0.94;
      wheelAccum = 0;
      window.trafficLight.resizeWindowBy(factor);
    }, { passive: false });

    let feedbackTimer = null;
    function showFeedback(text) {
      clearTimeout(feedbackTimer);
      tooltip.textContent = text;
      tooltip.style.opacity = '1';
      feedbackTimer = setTimeout(() => {
        tooltip.style.opacity = '';
        refresh();
      }, 3000);
    }

    // One answer per ask: a double click must not answer the next request too.
    function answer(decision) {
      if (!currentRequest || answerBtns[0].disabled) return;
      answerBtns.forEach((b) => { b.disabled = true; });
      Promise.resolve(window.trafficLight.answerRequest(currentRequest.id, decision)).then((ok) => {
        if (ok === false) answerBtns.forEach((b) => { b.disabled = false; });
      }).catch((err) => {
        console.error('[answer]', err);
        answerBtns.forEach((b) => { b.disabled = false; });
      });
    }
    document.getElementById('allow').addEventListener('click', (e) => { e.stopPropagation(); answer('allow'); });
    document.getElementById('deny').addEventListener('click', (e) => { e.stopPropagation(); answer('deny'); });
    window.trafficLight.onEvent((name) => rig.playEvent(name));

    // Voice states from main: the mic badge while listening, what was heard
    // and the answer on the tooltip, and the mouth working while he talks.
    let voiceTimer = null;
    function showVoiceText(text, ms) {
      clearTimeout(feedbackTimer);
      clearTimeout(voiceTimer);
      tooltip.textContent = text;
      tooltip.style.opacity = '1';
      if (ms) voiceTimer = setTimeout(() => { tooltip.style.opacity = ''; refresh(); }, ms);
    }
    window.trafficLight.onVoice((st) => {
      const listening = st.state === 'listening';
      document.body.classList.toggle('listening', listening);
      rig.talking(st.state === 'talking');
      if (listening) showVoiceText(st.partial ? `“${st.partial}”` : 'Listening…');
      else if (st.state === 'authorizing') showVoiceText('Allow Claude Buddy in the macOS prompt');
      else if (st.state === 'thinking') showVoiceText(st.heard ? `“${st.heard}”` : '…');
      else if (st.state === 'talking') showVoiceText(st.text || '');
      else if (st.state === 'error') showVoiceText(st.error || 'Could not listen', 6000);
      else showVoiceText(tooltip.textContent, 4000);
    });
    window.trafficLight.onSoundFlash(() => rig.flash(600));

    // Gestures are programmable per state (Lights → On click). The main
    // process resolves the action; we just show feedback and any reaction.
    async function gesture(g) {
      const r = await window.trafficLight.gesture(g);
      if (!r) return;
      if (r.react) rig.react(r.react, r.ms || 1400);
      if (r.feedback) showFeedback(r.feedback);
    }
    let clickTimer = null;
    app.addEventListener('dblclick', () => { clearTimeout(clickTimer); clickTimer = null; gesture('double'); });
    app.addEventListener('click', (e) => {
      if (swallowClick) { swallowClick = false; return; }
      if (didDrag) return;
      // Clicking an agent chip names it and says what it is doing.
      const chip = e.target.closest && e.target.closest('.minion');
      if (chip) { showFeedback(`${chip.dataset.name} — ${chip.dataset.status}`); return; }
      if (e.target.closest && e.target.closest('.pet')) { if (rig.pokePet()) { showFeedback('!'); return; } }
      if (e.altKey) { gesture('alt'); return; }
      if (clickTimer) return;
      clickTimer = setTimeout(() => { clickTimer = null; gesture('click'); }, 230);
    });

    document.getElementById('gear').addEventListener('mousedown', (e) => e.stopPropagation());
    document.getElementById('gear').addEventListener('click', (e) => { e.stopPropagation(); window.trafficLight.openLights(); });

    document.getElementById('help').addEventListener('mousedown', (e) => e.stopPropagation());
    document.getElementById('help').addEventListener('click', (e) => { e.stopPropagation(); window.trafficLight.openHelp(); });

    // Right-click the widget → Lights editor (on Linux, the tray menu).
    app.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.trafficLight.widgetMenu();
    });
  </script>
</body>
</html>
