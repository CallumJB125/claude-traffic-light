<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Claude Traffic Light</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* The outer strip is left as plain (non-drag) window chrome so macOS can
     still grab the true window edge to resize; #app itself is what you drag
     to move the widget. Kept generous (10px) so the resize handle is easy
     to grab, not a hairline. */
  body {
    box-sizing: border-box;
    padding: 10px;
  }

  /* Deliberately NOT -webkit-app-region: drag — on macOS that region type
     swallows plain single clicks (the OS captures mousedown to start a
     potential window-drag before the click event ever reaches the page,
     so listeners never fire). Dragging is done manually in JS instead so
     clicks keep working. */
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .housing {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease;
  }

  .housing:active {
    transform: scale(0.96);
  }

  .rig {
    width: 100%;
    height: 100%;
    shape-rendering: crispEdges;
  }

  .lamp {
    fill: #3a3542;
    transition: fill 180ms ease;
  }

  .lamp.red.on {
    fill: #e2231a;
    filter: drop-shadow(0 0 3px rgba(226, 35, 26, 0.85));
  }
  .lamp.amber.on {
    fill: #f2a200;
    filter: drop-shadow(0 0 3px rgba(242, 162, 0, 0.85));
  }
  .lamp.green.on {
    fill: #2fae3e;
    filter: drop-shadow(0 0 3px rgba(47, 174, 62, 0.85));
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(47, 174, 62, 0.85)) brightness(1); }
    50% { filter: drop-shadow(0 0 5px rgba(47, 174, 62, 0.95)) brightness(1.2); }
  }

  /* Claude's raised right arm — pivots at the shoulder (where it meets the
     head) so a rotation reads as a wave, not a spin. */
  .arm-right {
    transform-origin: 59.5px 39px;
  }

  #rig.state-amber .arm-right {
    animation: wave 0.7s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-22deg); }
    70% { transform: rotate(10deg); }
  }

  /* Working: a very small idle bob, just enough to read as "alive." */
  #rig.state-green .claude-body {
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.2px); }
  }

  /* Out of tokens: a short, urgent shake rather than a continuous loop. */
  #rig.state-red .claude-body {
    animation: shake 0.5s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-1.5px); }
    75% { transform: translateX(1.5px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #rig .arm-right, #rig .claude-body, .lamp.green.on { animation: none !important; }
  }

  #tooltip {
    position: fixed;
    left: 50%;
    bottom: -26px;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(20, 20, 22, 0.92);
    font: 500 10px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms ease;
  }

  #app:hover #tooltip {
    opacity: 1;
  }
</style>
</head>
<body>
  <div id="app" title="">
    <div class="housing">
      <svg class="rig" id="rig" viewBox="0 0 64 82" xmlns="http://www.w3.org/2000/svg">
        <!-- sign: bar + three lamps. Fixed in place — it's what's being held up. -->
        <rect x="4" y="24" width="56" height="5" fill="#726c62" />
        <rect class="lamp red" id="lamp-red" x="7" y="7" width="15" height="15" rx="2.5" />
        <rect class="lamp amber" id="lamp-amber" x="24.5" y="7" width="15" height="15" rx="2.5" />
        <rect class="lamp green" id="lamp-green" x="42" y="7" width="15" height="15" rx="2.5" />

        <!-- claude, smaller, planted underneath -->
        <g class="claude-body" fill="#da7756">
          <rect x="0" y="29" width="9" height="10" />
          <rect class="arm-right" x="55" y="29" width="9" height="10" />
          <rect x="17" y="39" width="30" height="13" />
          <rect x="4" y="52" width="56" height="7" />
          <rect x="15" y="59" width="7" height="9" />
          <rect x="28.5" y="59" width="7" height="9" />
          <rect x="42" y="59" width="7" height="9" />
          <rect x="22" y="43.5" width="4.5" height="4.5" fill="#211f1c" />
          <rect x="37.5" y="43.5" width="4.5" height="4.5" fill="#211f1c" />
        </g>
      </svg>
    </div>
    <div id="tooltip"></div>
  </div>

  <script>
    const lampRed = document.getElementById('lamp-red');
    const lampAmber = document.getElementById('lamp-amber');
    const lampGreen = document.getElementById('lamp-green');
    const rig = document.getElementById('rig');
    const tooltip = document.getElementById('tooltip');
    const app = document.getElementById('app');

    let lastState = null;
    function applyState(state) {
      lampRed.classList.toggle('on', state === 'red');
      lampAmber.classList.toggle('on', state === 'amber');
      lampGreen.classList.toggle('on', state === 'green');
      // Only touch the class (and so only restart its CSS animation) when
      // the state actually changes — refresh() polls every few seconds
      // regardless, and re-adding an unchanged class would restart the
      // infinite wave animation on every poll, causing a visible stutter.
      if (state !== lastState) {
        rig.classList.remove('state-red', 'state-amber', 'state-green');
        rig.classList.add(`state-${state}`);
        lastState = state;
      }
    }

    async function refresh() {
      const data = await window.trafficLight.getAggregateStatus();
      if (!data) return;
      applyState(data.state);
      const labels = {
        green: 'Claude is working',
        amber: 'Needs your input',
        red: 'Out of tokens',
      };
      const count = data.sessions?.length || 0;
      const suffix = data.reason === 'manual'
        ? ' (manual override)'
        : count
          ? ` — ${count} session${count === 1 ? '' : 's'}`
          : ' (no active sessions)';
      tooltip.textContent = (labels[data.state] || '') + suffix;
    }

    refresh();
    window.trafficLight.onStatusChanged(refresh);

    // Manual window dragging (see the CSS comment on #app for why).
    let dragOrigin = null; // {mouseX, mouseY, winX, winY} in screen coords
    let didDrag = false;

    app.addEventListener('mousedown', async (e) => {
      const winPos = await window.trafficLight.getWindowPosition();
      dragOrigin = { mouseX: e.screenX, mouseY: e.screenY, winX: winPos.x, winY: winPos.y };
      didDrag = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragOrigin || e.buttons !== 1) return;
      const dx = e.screenX - dragOrigin.mouseX;
      const dy = e.screenY - dragOrigin.mouseY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      if (didDrag) {
        window.trafficLight.setWindowPosition(dragOrigin.winX + dx, dragOrigin.winY + dy);
      }
    });

    window.addEventListener('mouseup', () => {
      dragOrigin = null;
    });

    let feedbackTimer = null;
    function showFeedback(text) {
      clearTimeout(feedbackTimer);
      tooltip.textContent = text;
      tooltip.style.opacity = '1';
      feedbackTimer = setTimeout(() => {
        tooltip.style.opacity = '';
        refresh();
      }, 3000);
    }

    app.addEventListener('click', async () => {
      if (didDrag) return;
      const result = await window.trafficLight.goToNeedingSession();
      if (!result) return;
      if (result.total === 0) {
        showFeedback('Nothing waiting — opened claude.ai');
      } else {
        const folder = result.cwd.split('/').filter(Boolean).pop() || result.cwd;
        const badge = result.total > 1 ? ` (${result.index}/${result.total})` : '';
        showFeedback(`→ ${folder}${badge} · path copied`);
      }
    });
  </script>
</body>
</html>
