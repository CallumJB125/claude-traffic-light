<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Claude Traffic Light</title>
<link rel="stylesheet" href="rig.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* The outer strip is plain (non-drag) window chrome so macOS can grab the
     true window edge to resize by dragging. */
  body {
    box-sizing: border-box;
    padding: 12px;
  }

  /* Deliberately NOT -webkit-app-region: drag — on macOS that swallows plain
     clicks. Dragging is done manually in JS so clicks keep working. */
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .housing {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease;
  }
  .housing:active { transform: scale(0.96); }

  #tooltip {
    position: fixed;
    left: 50%;
    bottom: -26px;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(20, 20, 22, 0.92);
    font: 500 10px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  #app:hover #tooltip { opacity: 1; }
</style>
</head>
<body>
  <div id="app" title="">
    <div class="housing" id="housing"></div>
    <div id="tooltip"></div>
  </div>

  <script src="rig.js"></script>
  <script>
    const rig = mountRig(document.getElementById('housing'));
    const tooltip = document.getElementById('tooltip');
    const app = document.getElementById('app');

    let lastRuleId = null;
    let sleepSince = null;
    let confettiTimer = null;
    const GRUMPY_AFTER_MS = 3 * 60 * 1000;

    async function refresh() {
      const data = await window.trafficLight.getAggregateStatus();
      if (!data) return;
      const look = { ...data.look };
      sleepSince = look.pose === 'sleep' ? (sleepSince ?? Date.now()) : null;
      look.grumpy = sleepSince !== null && Date.now() - sleepSince > GRUMPY_AFTER_MS;
      rig.setLook(look);
      // Confetti fires on entering a celebrating state, then again every 10s
      // for as long as that state holds.
      if (look.celebrate && look.ruleId !== lastRuleId) {
        rig.celebrate();
        clearInterval(confettiTimer);
        confettiTimer = setInterval(() => rig.celebrate(), 10000);
      } else if (!look.celebrate) {
        clearInterval(confettiTimer);
        confettiTimer = null;
      }
      lastRuleId = look.ruleId;

      const count = data.sessions?.length || 0;
      const suffix = data.reason === 'manual'
        ? ' (manual override)'
        : data.reason === 'preview'
          ? ' (preview)'
          : count
            ? ` — ${count} session${count === 1 ? '' : 's'}`
            : ' (no active sessions)';
      tooltip.textContent = (look.name || 'Claude Traffic Light') + suffix;
    }

    refresh();
    window.trafficLight.onStatusChanged(refresh);
    window.trafficLight.onBurst((ms) => rig.burst(ms));

    let dragOrigin = null;
    let didDrag = false;

    app.addEventListener('mousedown', async (e) => {
      const winPos = await window.trafficLight.getWindowPosition();
      dragOrigin = { mouseX: e.screenX, mouseY: e.screenY, winX: winPos.x, winY: winPos.y };
      didDrag = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragOrigin || e.buttons !== 1) return;
      const dx = e.screenX - dragOrigin.mouseX;
      const dy = e.screenY - dragOrigin.mouseY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      if (didDrag) window.trafficLight.setWindowPosition(dragOrigin.winX + dx, dragOrigin.winY + dy);
    });

    window.addEventListener('mouseup', () => {
      dragOrigin = null;
    });

    let wheelAccum = 0;
    app.addEventListener('wheel', (e) => {
      e.preventDefault();
      wheelAccum += e.deltaY;
      if (Math.abs(wheelAccum) < 12) return;
      const factor = wheelAccum < 0 ? 1.06 : 0.94;
      wheelAccum = 0;
      window.trafficLight.resizeWindowBy(factor);
    }, { passive: false });

    let feedbackTimer = null;
    function showFeedback(text) {
      clearTimeout(feedbackTimer);
      tooltip.textContent = text;
      tooltip.style.opacity = '1';
      feedbackTimer = setTimeout(() => {
        tooltip.style.opacity = '';
        refresh();
      }, 3000);
    }

    app.addEventListener('click', async () => {
      if (didDrag) return;
      const result = await window.trafficLight.goToNeedingSession();
      if (!result) return;
      if (result.total === 0) {
        showFeedback('Nothing waiting — opened claude.ai');
      } else {
        const folder = result.cwd.split('/').filter(Boolean).pop() || result.cwd;
        const badge = result.total > 1 ? ` (${result.index}/${result.total})` : '';
        const precision = result.exact ? ' · tab found' : '';
        showFeedback(`→ ${folder}${badge}${precision} · path copied`);
      }
    });

    // Right-click the widget → Lights editor.
    app.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.trafficLight.openLights();
    });
  </script>
</body>
</html>
