<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Claude Traffic Light</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* The outer few pixels are left as plain (non-drag) window chrome so
     macOS can still grab the true window edge to resize; #app itself is
     what you drag to move the widget. */
  body {
    box-sizing: border-box;
    padding: 5px;
  }

  /* Deliberately NOT -webkit-app-region: drag — on macOS that region type
     swallows plain single clicks (the OS captures mousedown to start a
     potential window-drag before the click event ever reaches the page,
     so listeners never fire). Dragging is done manually in JS instead so
     clicks keep working. */
  #app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .housing {
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, #34343a, #19191c 65%);
    border-radius: 22%;
    padding: 10% 14%;
    box-sizing: border-box;
    box-shadow:
      0 4px 10px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      inset 0 -1px 2px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    transition: transform 120ms ease;
  }

  .housing:active {
    transform: scale(0.97);
  }

  .lamp {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: #262024;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.55);
    transition: background 180ms ease, box-shadow 180ms ease;
  }

  .lamp.red.on {
    background: radial-gradient(circle at 35% 30%, #ff9d90, #e2231a 55%, #7a0c07 100%);
    box-shadow: 0 0 6px 1px rgba(226, 35, 26, 0.55), inset 0 1px 2px rgba(0, 0, 0, 0.25);
  }
  .lamp.amber.on {
    background: radial-gradient(circle at 35% 30%, #ffe29e, #f2a200 55%, #7a5000 100%);
    box-shadow: 0 0 6px 1px rgba(242, 162, 0, 0.55), inset 0 1px 2px rgba(0, 0, 0, 0.25);
  }
  .lamp.green.on {
    background: radial-gradient(circle at 35% 30%, #b8f2a8, #2fae3e 55%, #0a5218 100%);
    box-shadow: 0 0 6px 1px rgba(47, 174, 62, 0.55), inset 0 1px 2px rgba(0, 0, 0, 0.25);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }

  #tooltip {
    position: fixed;
    left: 50%;
    bottom: -26px;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(20, 20, 22, 0.92);
    font: 500 10px -apple-system, system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.9);
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms ease;
  }

  #app:hover #tooltip {
    opacity: 1;
  }
</style>
</head>
<body>
  <div id="app" title="">
    <div class="housing">
      <div class="lamp red" id="lamp-red"></div>
      <div class="lamp amber" id="lamp-amber"></div>
      <div class="lamp green" id="lamp-green"></div>
    </div>
    <div id="tooltip"></div>
  </div>

  <script>
    const lampRed = document.getElementById('lamp-red');
    const lampAmber = document.getElementById('lamp-amber');
    const lampGreen = document.getElementById('lamp-green');
    const tooltip = document.getElementById('tooltip');
    const app = document.getElementById('app');

    function applyState(state) {
      lampRed.classList.toggle('on', state === 'red');
      lampAmber.classList.toggle('on', state === 'amber');
      lampGreen.classList.toggle('on', state === 'green');
    }

    async function refresh() {
      const data = await window.trafficLight.getAggregateStatus();
      if (!data) return;
      applyState(data.state);
      const labels = {
        green: 'Claude is working',
        amber: 'Needs your input',
        red: 'Out of tokens',
      };
      const count = data.sessions?.length || 0;
      const suffix = data.reason === 'manual'
        ? ' (manual override)'
        : count
          ? ` — ${count} session${count === 1 ? '' : 's'}`
          : ' (no active sessions)';
      tooltip.textContent = (labels[data.state] || '') + suffix;
    }

    refresh();
    window.trafficLight.onStatusChanged(refresh);

    // Manual window dragging (see the CSS comment on #app for why).
    let dragOrigin = null; // {mouseX, mouseY, winX, winY} in screen coords
    let didDrag = false;

    app.addEventListener('mousedown', async (e) => {
      const winPos = await window.trafficLight.getWindowPosition();
      dragOrigin = { mouseX: e.screenX, mouseY: e.screenY, winX: winPos.x, winY: winPos.y };
      didDrag = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragOrigin || e.buttons !== 1) return;
      const dx = e.screenX - dragOrigin.mouseX;
      const dy = e.screenY - dragOrigin.mouseY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      if (didDrag) {
        window.trafficLight.setWindowPosition(dragOrigin.winX + dx, dragOrigin.winY + dy);
      }
    });

    window.addEventListener('mouseup', () => {
      dragOrigin = null;
    });

    let feedbackTimer = null;
    function showFeedback(text) {
      clearTimeout(feedbackTimer);
      tooltip.textContent = text;
      tooltip.style.opacity = '1';
      feedbackTimer = setTimeout(() => {
        tooltip.style.opacity = '';
        refresh();
      }, 3000);
    }

    app.addEventListener('click', async () => {
      if (didDrag) return;
      const result = await window.trafficLight.goToNeedingSession();
      if (!result) return;
      if (result.total === 0) {
        showFeedback('Nothing waiting — opened claude.ai');
      } else {
        const folder = result.cwd.split('/').filter(Boolean).pop() || result.cwd;
        const badge = result.total > 1 ? ` (${result.index}/${result.total})` : '';
        showFeedback(`→ ${folder}${badge} · path copied`);
      }
    });
  </script>
</body>
</html>
