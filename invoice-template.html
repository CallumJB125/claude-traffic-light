<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; script-src 'none'">
<title>{{TITLE}}</title>
<style>
body { font: 12px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #111; margin: 0; }
h1 { font-size: 20px; margin: 0 0 2px; } h2 { font-size: 14px; margin: 22px 0 6px; }
.meta { color: #555; margin: 0 0 14px; }
.basis { display: inline-block; padding: 2px 10px; border: 1px solid #999; border-radius: 10px; font-weight: 600; }
.note { margin: 10px 0; padding: 8px 10px; background: #f4f4f4; border-left: 3px solid #888; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #ddd; vertical-align: top; overflow-wrap: anywhere; }
th { font-size: 11px; color: #555; border-bottom: 1px solid #888; }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tfoot td { font-weight: 700; border-top: 2px solid #111; border-bottom: 0; }
</style></head>
<body>
<h1>{{TITLE}}</h1>
<p class="meta">Period {{PERIOD}} · prepared {{GENERATED}} · <span class="basis">{{BASIS}}</span></p>
<p class="note">{{NOTE}}</p>
<h2>By client</h2>
<table><thead><tr><th>Client</th><th class="n">Cost USD</th><th class="n">Billed USD</th></tr></thead><tbody>
{{CLIENTS}}
</tbody></table>
<h2>Line items</h2>
<table><thead><tr><th>Date</th><th>Client</th><th>Project</th><th>Model</th><th class="n">Tokens</th><th class="n">Hours</th><th class="n">Cost USD</th><th class="n">Billed USD</th></tr></thead><tbody>
{{ROWS}}
</tbody><tfoot><tr><td colspan="6">Total</td><td class="n">{{COST}}</td><td class="n">{{BILLED}}</td></tr></tfoot></table>
</body></html>
