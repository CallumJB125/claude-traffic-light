<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>overlay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Full-display, click-through canvas that streams tracer rounds from the
  // widget's position across the screen while the ak47 pose is live. The main
  // process tells us where the muzzle is (display-relative) and which way to
  // fire; we stop drawing the moment it says stop, and the window is closed.
  window.__errs = [];
  window.addEventListener('error', (e) => window.__errs.push(`${e.message} @${e.lineno}:${e.colno}`));
  const canvas = document.getElementById('c');
  // `let`, not `const`: the pot cache temporarily points the drawing helpers
  // at an offscreen context.
  let ctx = canvas.getContext('2d');
  const screenCtx = ctx;
  const dpr = window.devicePixelRatio || 1;
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    screenCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let muzzle = null; // {x, y, dir:{x,y}}
  let firingUntil = 0;
  const bullets = [];
  const sparks = [];
  let lastShot = 0;
  let raf = null;
  const firing = () => performance.now() < firingUntil;
  // sniper state
  let scope = null;     // {x, y, until}
  let cursor = null;    // tracked cursor, for the reticle
  const shots = [];     // {mx,my,tx,ty,t0}
  const holes = [];     // {x,y,t0}
  const kick = () => { if (!raf) loop(performance.now()); };

  window.overlay.onBurst((m, ms) => { muzzle = m; firingUntil = performance.now() + ms; lastShot = 0; kick(); });
  window.overlay.onStop(() => { firingUntil = 0; scope = null; fx = { fx: 'none' }; });
  // Screen effects: persistent modes drawn every frame while set.
  let fx = { fx: 'none' };
  const confetti = [];
  let lastConfetti = 0;
  window.overlay.onFx((p) => { fx = p || { fx: 'none' }; lastConfetti = 0; kick(); });
  function spawnConfetti() {
    for (let i = 0; i < 90; i += 1) confetti.push({ x: W * 0.5 + (Math.random() - 0.5) * W * 0.4, y: -10, vx: (Math.random() - 0.5) * 6, vy: 2 + Math.random() * 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, c: ['#f2a200', '#2fae3e', '#e2231a', '#38bdf8', '#f472b6', '#f2efe8'][i % 6], life: 1 });
  }
  window.overlay.onTrack((t) => { cursor = t; });
  window.overlay.onScope((t) => { scope = { x: t.x, y: t.y, until: performance.now() + 700 }; cursor = t; kick(); });
  window.overlay.onSnipe((m, t) => { scope = null; shots.push({ mx: m.x, my: m.y, tx: t.x, ty: t.y, t0: performance.now() }); holes.push({ x: t.x, y: t.y, t0: performance.now() }); kick(); });

  // ── Garden across the screen: pots anywhere, drying rack, and the buyer
  const garden = { on: false, pots: [], deal: null, hammock: null, neglect: null, animals: [], wakeAt: null };
  window.overlay.onGarden((p) => {
    const ox = p.ox || 0, oy = p.oy || 0;
    if (p.op === 'start') { garden.on = true; garden.pots = []; garden.deal = null; }
    if (p.op === 'pot') garden.pots.push({ x: p.x - ox, y: p.y - oy, dirt: false, seed: false, water: false, crop: null, sown: 0, growMs: 1, bites: [], rack: null });
    const pot = garden.pots[p.i];
    if (p.op === 'dirt' && pot) pot.dirt = true;
    if (p.op === 'seed' && pot) pot.seed = true;
    if (p.op === 'water' && pot) pot.water = true;
    if (p.op === 'sow' && pot) { pot.crop = p.crop; pot.sown = performance.now(); pot.growMs = p.growMs; pot.bites = [true, true, true, true]; pot.rack = null; }
    if (p.op === 'bite' && pot) { const k = pot.bites.findIndex((b) => b); if (k >= 0) pot.bites[k] = false; }
    if (p.op === 'harvest' && pot) { pot.crop = null; pot.rack = { t0: performance.now(), dryMs: p.dryMs }; }
    if (p.op === 'unrack' && pot) { pot.rack = null; }
    if (p.op === 'process' && pot) { pot.table = { t0: performance.now(), ms: p.ms }; }
    if (p.op === 'jar' && pot) { pot.table = null; pot.jar = true; }
    if (p.op === 'deal' && pot) { pot.jar = false; garden.deal = { i: p.i, t0: performance.now(), ms: p.ms, claude: { x: p.claude.x - ox, y: p.claude.y - oy, w: p.claude.w, h: p.claude.h }, fromLeft: pot.x > W / 2, buyer: makeBuyer(p.seed || 1) }; }
    if (p.op === 'clearpot' && pot) { pot.crop = null; pot.rack = null; pot.table = null; pot.jar = false; pot.seed = false; garden.deal = null; }
    if (p.op === 'pull') garden.pots.forEach((q) => { q.crop = null; });
    if (p.op === 'hammock') garden.hammock = { x: p.x - ox, y: p.y - oy, w: p.w };
    if (p.op === 'neglect') { garden.neglect = { t0: performance.now(), ms: p.ms }; garden.animals = []; }
    if (p.op === 'wake') { garden.wakeAt = performance.now(); garden.hammock = null; for (const a of (garden.animals || [])) a.flee = true; }
    if (p.op === 'smash' && pot) { pot.smashed = performance.now(); pot.crop = null; pot.rack = null; pot.table = null; pot.jar = false; }
    if (p.op === 'clear') { garden.on = false; garden.pots = []; garden.deal = null; garden.hammock = null; garden.neglect = null; garden.animals = []; }
    kick();
  });
  // 0..1 how untended the garden is: rises while he sleeps, falls after he wakes
  function overgrowth(t) {
    if (!garden.neglect) return 0;
    const up = Math.min(1, (t - garden.neglect.t0) / garden.neglect.ms);
    if (garden.wakeAt) { const down = Math.min(1, (t - garden.wakeAt) / 6000); if (down >= 1) { garden.neglect = null; garden.wakeAt = null; garden.animals = []; return 0; } return up * (1 - down); }
    return up;
  }
  function drawVines(x, y, g, t) {
    if (g <= 0.05) return;
    ctx.strokeStyle = '#3f8a2f'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k += 1) {
      const dir = k % 2 ? 1 : -1, len = 60 * g;
      ctx.beginPath(); ctx.moveTo(x + dir * 12, y - 2);
      for (let i = 1; i <= 6; i += 1) { const tt = i / 6; ctx.lineTo(x + dir * (12 + len * tt) + Math.sin(tt * 9 + k + t / 1500) * 6 * g, y - 2 - Math.sin(tt * 3.2) * 24 * g); }
      ctx.stroke();
      for (let i = 1; i <= 4; i += 1) { const tt = i / 4; leaf(x + dir * (12 + len * tt), y - 2 - Math.sin(tt * 3.2) * 24 * g, 5 * g, 3 * g, '#4f9a3a'); }
    }
    ctx.fillStyle = '#4f9a3a';
    for (let i = 0; i < 7; i += 1) { const gx = x - 30 + i * 10 + (i % 2) * 3; ctx.beginPath(); ctx.moveTo(gx - 3, y + 2); ctx.lineTo(gx, y + 2 - 14 * g - (i % 3) * 3 * g); ctx.lineTo(gx + 3, y + 2); ctx.closePath(); ctx.fill(); }
  }
  // Animals move in while it's overgrown: rabbits hop pot to pot, a fox
  // trots along, birds fly across, snails creep. They scatter when he wakes.
  const ANIMALS = ['rabbit', 'rabbit', 'bird', 'fox', 'snail', 'bird', 'rabbit', 'squirrel'];
  function updateAnimals(t, g) {
    if (!garden.neglect || garden.wakeAt) { /* fleeing or none */ } else if (g > 0.35 && garden.animals.length < Math.floor(2 + g * 6) && Math.random() < 0.02) {
      const kind = ANIMALS[garden.animals.length % ANIMALS.length];
      const pot = garden.pots[Math.floor(Math.random() * garden.pots.length)];
      garden.animals.push({ kind, x: pot ? pot.x + 40 : W / 2, y: kind === 'bird' ? (pot ? pot.y - 90 : 200) : (pot ? pot.y : H - 60), vx: (Math.random() < 0.5 ? -1 : 1) * (kind === 'snail' ? 0.15 : kind === 'bird' ? 2.2 : 0.8), t0: t, flee: false });
    }
    for (let i = garden.animals.length - 1; i >= 0; i -= 1) {
      const a = garden.animals[i];
      const speed = a.flee ? 6 : Math.abs(a.vx);
      a.x += Math.sign(a.vx) * speed;
      if (a.kind === 'bird') a.y += Math.sin(t / 300 + i) * 0.8;
      if (!a.flee && (a.x < 40 || a.x > W - 40)) a.vx = -a.vx;
      if (a.flee && (a.x < -60 || a.x > W + 60)) { garden.animals.splice(i, 1); continue; }
      drawAnimal(a, t);
    }
  }
  function drawAnimal(a, t) {
    const dir = Math.sign(a.vx) || 1; const hop = a.kind === 'rabbit' ? Math.abs(Math.sin(t / 180)) * 10 : 0;
    ctx.save(); ctx.translate(a.x, a.y - hop); ctx.scale(dir, 1);
    const R = (px, py, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(px, py, w, h); };
    if (a.kind === 'rabbit') { R(-8, -10, 16, 10, '#e9e4d8'); R(4, -16, 8, 8, '#e9e4d8'); R(6, -26, 3, 11, '#e9e4d8'); R(10, -26, 3, 11, '#e9e4d8'); R(9, -14, 1.5, 1.5, '#211f1c'); R(-10, -8, 3, 3, '#f2efe8'); }
    else if (a.kind === 'fox') { R(-14, -10, 26, 9, '#d9692a'); R(10, -15, 9, 8, '#d9692a'); R(12, -20, 3, 5, '#d9692a'); R(16, -20, 3, 5, '#d9692a'); R(-24, -8, 11, 5, '#d9692a'); R(-24, -8, 4, 5, '#f2efe8'); R(16, -12, 1.5, 1.5, '#211f1c'); R(-10, -1, 3, 4, '#a84f1e'); R(0, -1, 3, 4, '#a84f1e'); R(8, -1, 3, 4, '#a84f1e'); }
    else if (a.kind === 'bird') { const f = Math.sin(t / 90) * 5; R(-5, -3, 10, 6, '#38bdf8'); R(4, -6, 5, 5, '#38bdf8'); R(9, -4, 3, 2, '#f2a200'); R(-3, -6 - f, 7, 3, '#0aa3ff'); R(6, -5, 1.2, 1.2, '#211f1c'); }
    else if (a.kind === 'snail') { ctx.fillStyle = '#f2a200'; ctx.beginPath(); ctx.arc(0, -6, 6, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#a86a00'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, -6, 3.5, 0, Math.PI * 1.6); ctx.stroke(); R(-8, -4, 18, 4, '#c9c0a0'); R(8, -10, 1.2, 6, '#c9c0a0'); R(11, -10, 1.2, 6, '#c9c0a0'); }
    else { R(-8, -9, 14, 9, '#8a5a2b'); R(4, -14, 7, 7, '#8a5a2b'); R(-16, -18, 8, 14, '#8a5a2b'); R(8, -12, 1.4, 1.4, '#211f1c'); R(-10, -2, 4, 2, '#8a5a2b'); }
    ctx.restore();
  }
  function drawHammock(h, t) {
    const sway = Math.sin(t / 900) * 4;
    ctx.fillStyle = '#6b4420'; ctx.fillRect(h.x - h.w / 2 - 4, h.y - 70, 6, 70); ctx.fillRect(h.x + h.w / 2 - 2, h.y - 70, 6, 70);
    ctx.strokeStyle = '#d9c9a8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(h.x - h.w / 2, h.y - 62); ctx.quadraticCurveTo(h.x, h.y - 20 + sway, h.x + h.w / 2, h.y - 62); ctx.stroke();
    ctx.strokeStyle = 'rgba(217,201,168,0.7)'; ctx.lineWidth = 1;
    for (let i = 1; i < 6; i += 1) { const tt = i / 6; const px = h.x - h.w / 2 + h.w * tt; const py = h.y - 62 + (1 - Math.abs(tt - 0.5) * 2) * (42 + sway); ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px, py + 6); ctx.stroke(); }
  }
  // ── Cached pot rendering ────────────────────────────────────────────────
  // A pot with a full-grown crop is a static picture: the only thing that
  // changes frame to frame is a 2px sway. Redrawing twelve serrated cannabis
  // plants (hundreds of paths each) sixty times a second was the single most
  // expensive thing the app did. Each pot is drawn once into its own small
  // offscreen canvas and blitted after that, re-rendered only when something
  // about it actually changes.
  // Tall enough for a fully-grown, fully-overgrown cannabis plant (66 units of
  // stem above the soil line, ×1.8 at peak neglect) plus the pot below it.
  const POT_CACHE_W = 220, POT_CACHE_H = 250, POT_CACHE_OX = 110, POT_CACHE_OY = 210;
  // Growth and the overgrowth swell are quantised: the crop only re-renders
  // when it visibly changes size, not on every frame of a four-minute grow.
  function potSignature(pot, t, big) {
    const grow = pot.crop ? Math.round(Math.min(1, (t - pot.sown) / pot.growMs) * 40) : -1;
    return [pot.dirt, pot.seed, pot.water, pot.crop, grow, Math.round(big * 20), pot.bites.join(''), pot.jar ? 1 : 0].join('|');
  }
  function potLayer(pot, t, big) {
    const sig = potSignature(pot, t, big);
    if (pot._sig === sig && pot._layer) return pot._layer;
    if (!pot._layer) {
      pot._layer = document.createElement('canvas');
      pot._layer.width = POT_CACHE_W * dpr; pot._layer.height = POT_CACHE_H * dpr;
    }
    const lc = pot._layer.getContext('2d');
    lc.setTransform(dpr, 0, 0, dpr, 0, 0);
    lc.clearRect(0, 0, POT_CACHE_W, POT_CACHE_H);
    // Draw into the layer with the real ctx pointed at it, so the existing
    // drawing helpers need no changes.
    const real = ctx;
    ctx = lc;
    const x = POT_CACHE_OX, y = POT_CACHE_OY;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(x, y + 2, 26, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b8683a'; ctx.beginPath(); ctx.moveTo(x - 22, y - 34); ctx.lineTo(x + 22, y - 34); ctx.lineTo(x + 17, y); ctx.lineTo(x - 17, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9784a'; ctx.fillRect(x - 25, y - 38, 50, 7);
    if (pot.dirt) { ctx.fillStyle = pot.water ? '#2f1f14' : '#4a3222'; ctx.fillRect(x - 19, y - 32, 38, 9); }
    if (pot.seed && !pot.crop && !pot.rack) { ctx.fillStyle = '#f2d16b'; ctx.beginPath(); ctx.arc(x, y - 27, 2.5, 0, Math.PI * 2); ctx.fill(); }
    if (pot.crop) {
      const gr = Math.min(1, (t - pot.sown) / pot.growMs) * big;
      ctx.save(); ctx.translate(x, y - 30); ctx.scale(gr, gr);
      drawCrop(pot.crop, pot.bites);
      ctx.restore();
    }
    ctx = real;
    pot._sig = sig;
    return pot._layer;
  }

  function drawGarden(t) {
    if (!garden.on) return;
    const g = overgrowth(t);
    if (garden.hammock) drawHammock(garden.hammock, t);
    for (const pot of garden.pots) {
      const x = pot.x, y = pot.y;
      if (!pot.smashed) drawVines(x, y, g, t);
      if (pot.smashed) {
        // blows apart: terracotta shards fly out on an arc, a dust puff fades; gone after 1.2s
        const age = (t - pot.smashed) / 1200;
        if (age >= 1) continue;
        for (let i = 0; i < 10; i += 1) {
          const a = (i / 10) * Math.PI * 2 + 0.3, sp = 60 + (i * 37) % 40;
          const sx = x + Math.cos(a) * sp * age, sy = y - 20 - Math.sin(Math.abs(a)) * sp * age + 160 * age * age;
          ctx.save(); ctx.translate(sx, sy); ctx.rotate(age * 6 + i); ctx.fillStyle = i % 3 ? '#b8683a' : '#4a3222'; ctx.fillRect(-5, -3, 10, 6); ctx.restore();
        }
        ctx.fillStyle = `rgba(180,140,110,${0.5 * (1 - age)})`; ctx.beginPath(); ctx.arc(x, y - 18, 18 + 40 * age, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      // The pot and its crop come from the cache; the sway and the overgrowth
      // swell are applied as a cheap transform on the blit.
      const grown = pot.crop ? Math.min(1, (t - pot.sown) / pot.growMs) : 0;
      const sway = pot.crop ? Math.sin(t / 900 + x) * 2 * grown : 0;
      const big = pot.crop ? 1 + 0.8 * g : 1;
      const layer = potLayer(pot, t, big);
      ctx.drawImage(layer, 0, 0, layer.width, layer.height, x + sway - POT_CACHE_OX, y - POT_CACHE_OY, POT_CACHE_W, POT_CACHE_H);
      if (pot.rack) drawRack(x + 60, y, Math.min(1, (t - pot.rack.t0) / pot.rack.dryMs));
      if (pot.table) drawTable(x + 60, y, Math.min(1, (t - pot.table.t0) / pot.table.ms), t);
      if (pot.jar) drawJar(x + 60, y - 2, true);
    }
    if (garden.deal) drawDeal(t);
    updateAnimals(t, g);
  }
  function drawRack(x, y, dry) {
    // a line between two posts; branches hang upside-down from it, buds browning as they dry
    ctx.fillStyle = '#6b4420'; ctx.fillRect(x - 30, y - 72, 4, 72); ctx.fillRect(x + 26, y - 72, 4, 72);
    ctx.strokeStyle = '#d7ded6'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 28, y - 68); ctx.lineTo(x + 28, y - 68); ctx.stroke();
    for (const dx of [-18, -6, 6, 18]) {
      ctx.strokeStyle = '#4d7f2c'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x + dx, y - 68); ctx.lineTo(x + dx, y - 40); ctx.stroke();
      ctx.save(); ctx.translate(x + dx, y - 40); ctx.rotate(Math.PI); bud(0, 0, 16, 6, dry); ctx.restore();
      fanLeaf(x + dx + (dx < 0 ? -4 : 4), y - 56, Math.PI + (dx < 0 ? 0.5 : -0.5), 7, dry > 0.5 ? '#6f7a3a' : '#4f9a3a');
    }
    ctx.fillStyle = 'rgba(242,239,232,0.7)'; ctx.font = '10px -apple-system, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(dry >= 1 ? 'dry' : `drying ${Math.round(dry * 100)}%`, x, y + 14);
  }
  // Processing: bucking and trimming over a tray with scissors, weighing on
  // a scale, and packing the buds into a mason jar to cure.
  function drawTable(x, y, p, t) {
    ctx.fillStyle = '#6b4420'; ctx.fillRect(x - 34, y - 30, 68, 5); ctx.fillRect(x - 30, y - 25, 4, 25); ctx.fillRect(x + 26, y - 25, 4, 25);
    // tray with trim
    ctx.fillStyle = '#2b2b30'; ctx.fillRect(x - 32, y - 36, 30, 6); ctx.fillStyle = '#3d5a2a'; ctx.fillRect(x - 30, y - 34, 26 * (0.3 + 0.7 * p), 3);
    // scissors snipping over the tray
    const snip = Math.abs(Math.sin(t / 110)) * 0.5;
    ctx.save(); ctx.translate(x - 16, y - 44); ctx.strokeStyle = '#c9ccd3'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.rotate(-snip); ctx.lineTo(0, -12); ctx.stroke(); ctx.rotate(snip * 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -12); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(x - 18, y - 42, 2, 0, Math.PI * 2); ctx.arc(x - 14, y - 42, 2, 0, Math.PI * 2); ctx.fill();
    // untrimmed pile shrinking, trimmed bud growing
    if (p < 0.98) { ctx.save(); ctx.translate(x - 8, y - 32); bud(0, 0, 10 * (1 - p) + 3, 5, 1); ctx.restore(); }
    // scale
    ctx.fillStyle = '#4a4a52'; ctx.fillRect(x + 2, y - 36, 16, 6); ctx.fillStyle = '#9fe870'; ctx.fillRect(x + 4, y - 35, 12, 3);
    ctx.fillStyle = '#0b2a0b'; ctx.font = 'bold 4px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillText(`${(28 * p).toFixed(1)}g`, x + 10, y - 32.2);
    // jar with buds
    drawJar(x + 28, y - 30, p >= 0.98, p);
    ctx.fillStyle = 'rgba(242,239,232,0.7)'; ctx.font = '10px -apple-system, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p >= 0.98 ? 'jarred' : `trimming ${Math.round(p * 100)}%`, x, y + 14);
  }
  function drawJar(x, y, lidOn = true, fill = 1) {
    ctx.fillStyle = 'rgba(200,230,255,0.75)'; ctx.fillRect(x - 7, y - 18, 14, 18);
    const n = Math.round(fill * 6);
    for (let i = 0; i < n; i += 1) { const bx = x - 4 + (i % 2) * 5, by = y - 3 - Math.floor(i / 2) * 5; leaf(bx, by, 2.6, 2.2, i % 2 ? '#6d7a3a' : '#7f8f42'); ctx.fillStyle = '#b06a25'; ctx.fillRect(bx, by - 1, 0.9, 1.6); }
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - 6, y - 17, 1.5, 15);
    if (lidOn) { ctx.fillStyle = '#c9ccd3'; ctx.fillRect(x - 8, y - 22, 16, 4); ctx.fillStyle = '#8a8f99'; ctx.fillRect(x - 8, y - 19, 16, 1.2); }
  }
  // The buyer: generated from a seed so every deal brings someone new —
  // Lagos-rapper or Rastafari looks, mixed from parts.
  function rng(seed) { let a = seed >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
  function makeBuyer(seed) {
    const r = rng(seed);
    const pick = (arr) => arr[Math.floor(r() * arr.length)];
    const rasta = r() < 0.45;
    return {
      skin: pick(['#5a3a24', '#6e4428', '#8b5a35', '#3f2a1c', '#a06b44']),
      style: rasta ? 'rasta' : 'rapper',
      top: rasta ? pick(['#d62828', '#f4a300', '#1a7f3c', '#2b2b2b', '#f2efe8']) : pick(['#111', '#f2efe8', '#ffd400', '#7b2cbf', '#0aa3ff', '#e63946']),
      pants: pick(['#1a1a1e', '#2a3d8f', '#f2efe8', '#4b2e83', '#3a3a3a']),
      hat: rasta ? pick(['tam', 'tam', 'none', 'beanie']) : pick(['durag', 'snapback', 'bucket', 'none', 'beanie']),
      hatColor: pick(['#111', '#d62828', '#f4a300', '#1a7f3c', '#0aa3ff', '#f2efe8', '#7b2cbf']),
      dreads: rasta ? pick(['long', 'long', 'short']) : pick(['none', 'short', 'none', 'long']),
      shades: r() < 0.55,
      chain: !rasta && r() < 0.7,
      chainColor: pick(['#ffd400', '#e5e5e5', '#ffd400']),
      grillz: !rasta && r() < 0.35,
      stripes: rasta && r() < 0.6,
      boombox: r() < 0.3,
      spliff: rasta && r() < 0.5,
    };
  }
  // Same proportions as Claude's pixel body: head 30×13 over a 56×7 base, three legs.
  function drawBuyer(x, y, s, walk, b) {
    const bob = walk ? Math.sin(performance.now() / 90) * 1.5 : 0;
    const l = walk ? Math.sin(performance.now() / 90) * 3 : 0;
    ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
    const R = (px, py, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(px, py, w, h); };
    // dreads behind the head
    if (b.dreads !== 'none') { const len = b.dreads === 'long' ? 18 : 7; for (const dx of [-16, -12, -8, 8, 12, 16]) R(dx - 1, -28 + (walk ? Math.sin(performance.now() / 150 + dx) * 1.2 : 0), 2.4, len, '#1c120c'); }
    // body: top with optional rasta stripes, pants as the base slab, legs
    R(-15, -29, 30, 13, b.top);
    if (b.stripes) { R(-15, -29, 30, 4, '#d62828'); R(-15, -25, 30, 4, '#f4a300'); R(-15, -21, 30, 5, '#1a7f3c'); }
    R(-28, -16, 56, 7, b.pants);
    R(-17, -9, 7, 9 + l, b.pants); R(-3.5, -9, 7, 9 - l, b.pants); R(10, -9, 7, 9 + l, b.pants);
    // face
    R(-10, -27, 20, 9, b.skin);
    if (b.shades) { R(-9, -25, 8, 4, '#111'); R(1, -25, 8, 4, '#111'); R(-1, -24, 2, 1.5, '#111'); } else { R(-7, -25, 3, 3, '#211f1c'); R(4, -25, 3, 3, '#211f1c'); }
    if (b.grillz) { R(-4, -20, 8, 1.6, '#ffd400'); }
    // chain
    if (b.chain) { ctx.strokeStyle = b.chainColor; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-10, -17); ctx.quadraticCurveTo(0, -8, 10, -17); ctx.stroke(); R(-2, -12, 4, 4, b.chainColor); }
    // hats
    if (b.hat === 'tam') { ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.ellipse(0, -31, 17, 8, 0, Math.PI, 0); ctx.fill(); R(-17, -31, 34, 2, '#f4a300'); R(-17, -29, 34, 2, '#1a7f3c'); }
    if (b.hat === 'beanie') { R(-15, -36, 30, 8, b.hatColor); R(-15, -30, 30, 2, '#f2efe8'); }
    if (b.hat === 'durag') { R(-15, -33, 30, 5, b.hatColor); R(-19, -31, 6, 12, b.hatColor); }
    if (b.hat === 'snapback') { R(-15, -35, 30, 7, b.hatColor); R(-15, -29, 40, 2.5, b.hatColor); }
    if (b.hat === 'bucket') { R(-13, -37, 26, 8, b.hatColor); R(-19, -30, 38, 3, b.hatColor); }
    // props
    if (b.spliff) { R(8, -21, 7, 1.4, '#f2efe8'); R(14.5, -21, 1.2, 1.4, '#ff5a1f'); }
    if (b.boombox) { R(18, -16, 16, 10, '#2a2a2e'); R(20, -14, 5, 5, '#7c7c8a'); R(27, -14, 5, 5, '#7c7c8a'); R(22, -19, 8, 3, '#2a2a2e'); }

  }
  function drawNotes(x, y) { for (let i = 0; i < 3; i += 1) { ctx.fillStyle = '#3fa34a'; ctx.fillRect(x - 8 + i * 3, y - 6 - i * 2, 16, 8); ctx.fillStyle = '#2f8a3a'; ctx.fillRect(x - 3 + i * 3, y - 4 - i * 2, 6, 4); } }
  function drawDeal(t) {
    const d = garden.deal;
    const p = Math.min(1, (t - d.t0) / d.ms);
    const feetY = d.claude.y + d.claude.h - 12;
    const scale = d.claude.h / 82 * 0.95;
    const meetX = d.claude.x + (d.fromLeft ? -40 : d.claude.w + 40);
    const edgeX = d.fromLeft ? -60 : W + 60;
    let bx, walking = true;
    if (p < 0.4) bx = edgeX + (meetX - edgeX) * (p / 0.4);
    else if (p < 0.7) { bx = meetX; walking = false; }
    else bx = meetX + (edgeX - meetX) * ((p - 0.7) / 0.3);
    drawBuyer(bx, feetY, scale, walking, d.buyer);
    if (p >= 0.4 && p < 0.7) {
      const q = (p - 0.4) / 0.3;
      const cx = d.claude.x + (d.fromLeft ? 6 : d.claude.w - 6);
      drawJar(cx + (bx - cx) * Math.min(1, q * 1.4), feetY - 30 - Math.sin(Math.min(1, q * 1.4) * Math.PI) * 24);
      if (q > 0.35) drawNotes(bx + (cx - bx) * Math.min(1, (q - 0.35) * 1.6), feetY - 26 - Math.sin(Math.min(1, (q - 0.35) * 1.6) * Math.PI) * 20);
    } else if (p >= 0.7) drawNotes(d.claude.x + d.claude.w / 2, feetY - 6);
  }
  // A serrated leaflet: a narrow leaf with a toothed edge, pointing up from (0,0).
  function leaflet(len, w, c) {
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 0);
    const teeth = 7;
    for (let i = 1; i <= teeth; i += 1) { const t = i / teeth; const ww = w * Math.sin(Math.PI * Math.min(1, t * 1.1)); ctx.lineTo(ww * (i % 2 ? 1 : 0.72), -len * t); }
    ctx.lineTo(0, -len);
    for (let i = teeth; i >= 1; i -= 1) { const t = i / teeth; const ww = w * Math.sin(Math.PI * Math.min(1, t * 1.1)); ctx.lineTo(-ww * (i % 2 ? 1 : 0.72), -len * t); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke();
  }
  // A palmate fan leaf: 5 or 7 leaflets from one point, the centre one longest.
  function fanLeaf(x, y, rot, size, c) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const n = size > 14 ? 7 : 5; const spread = 0.42;
    for (let k = -(n - 1) / 2; k <= (n - 1) / 2; k += 1) { ctx.save(); ctx.rotate(k * spread); leaflet(size * (1 - 0.18 * Math.abs(k)), size * 0.16, c); ctx.restore(); }
    ctx.restore();
  }
  // A bud (cola): stacked green calyx ovals with orange pistils.
  function bud(x, y, h, w, dry = 0) {
    const g1 = dry ? `rgb(${120 + 40 * dry},${110 - 20 * dry},60)` : '#5f9d3c', g2 = dry ? `rgb(${100 + 30 * dry},${95 - 15 * dry},50)` : '#4c8330';
    for (let i = 0; i < 4; i += 1) { const yy = y - (i / 3) * h; const ww = w * (1 - i * 0.18); leaf(x, yy, ww, h * 0.22, i % 2 ? g1 : g2); }
    ctx.fillStyle = dry ? '#a85f1e' : '#e8862a';
    for (let i = 0; i < 6; i += 1) { const yy = y - h * (0.1 + 0.8 * ((i * 37) % 10) / 10); const xx = x + ((i * 53) % 7 - 3) * (w / 7); ctx.fillRect(xx, yy, 1.2, 2.2); }
    if (!dry) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; for (let i = 0; i < 4; i += 1) ctx.fillRect(x + ((i * 29) % 9 - 4) * (w / 9), y - h * ((i * 41) % 10) / 10, 0.9, 0.9); }
  }
  function drawCannabis(bites) {
    const stem = '#4d7f2c';
    ctx.fillStyle = stem; ctx.fillRect(-1.6, -66, 3.2, 66);
    // side branches with fan leaves
    for (const [dy, dir] of [[-18, -1], [-30, 1], [-42, -1], [-52, 1]]) { ctx.strokeStyle = stem; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, dy); ctx.lineTo(dir * 16, dy - 8); ctx.stroke(); fanLeaf(dir * 16, dy - 8, dir * 0.9, 15 - Math.abs(dy) * 0.08, '#4f9a3a'); }

    bud(0, -60, 22, 9); bud(-13, -36, 12, 6); bud(13, -46, 12, 6);
  }
  function leaf(x, y, w, h, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2); ctx.fill(); }
  function drawCrop(kind, bites) {
    const green = '#2f8a3a', stem = '#2fae3e';
    if (kind === 'carrot') { ctx.fillStyle = stem; ctx.fillRect(-1.5, -30, 3, 30); leaf(-8, -34, 6, 3, stem); leaf(8, -34, 6, 3, stem); if (bites[0]) { ctx.fillStyle = '#f28c28'; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.lineTo(0, 22); ctx.closePath(); ctx.fill(); } return; }
    if (kind === 'tomato') { ctx.fillStyle = green; ctx.fillRect(-1.5, -48, 3, 48); [[-9, -34], [9, -22], [0, -44]].forEach(([dx, dy], i) => { if (bites[i]) { ctx.fillStyle = '#e2231a'; ctx.beginPath(); ctx.arc(dx, dy, 6, 0, Math.PI * 2); ctx.fill(); } }); return; }
    if (kind === 'berries') { leaf(0, -16, 16, 13, green); [[-7, -18], [7, -14], [0, -8], [3, -22]].forEach(([dx, dy], i) => { if (bites[i]) { ctx.fillStyle = '#5b3fb8'; ctx.beginPath(); ctx.arc(dx, dy, 3.6, 0, Math.PI * 2); ctx.fill(); } }); return; }
    if (kind === 'sunflower') { ctx.fillStyle = stem; ctx.fillRect(-1.5, -56, 3, 56); for (let i = 0; i < 10; i += 1) { const a = (i / 10) * Math.PI * 2; leaf(Math.cos(a) * 11, -56 + Math.sin(a) * 11, 5, 3, '#f2a200'); } if (bites[0]) { ctx.fillStyle = '#5a3a1a'; ctx.beginPath(); ctx.arc(0, -56, 7, 0, Math.PI * 2); ctx.fill(); } return; }
    if (kind === 'apple') { ctx.fillStyle = '#6b4420'; ctx.fillRect(-3, -44, 6, 44); leaf(0, -52, 24, 20, green); leaf(-12, -44, 14, 11, '#3fa34a'); [[-12, -56], [10, -60], [12, -44], [-6, -40]].forEach(([dx, dy], i) => { if (bites[i]) { ctx.fillStyle = '#e2231a'; ctx.beginPath(); ctx.arc(dx, dy, 4.2, 0, Math.PI * 2); ctx.fill(); } }); return; }
    if (kind === 'weed') { drawCannabis(bites); return; }
    // flowers: not edible
    ctx.fillStyle = stem; ctx.fillRect(-1.5, -30, 3, 30); const c = ['#f472b6', '#38bdf8', '#a78bfa'][Math.abs(Math.round(bites.length * 7)) % 3]; [[-7, -34], [7, -34], [0, -41], [0, -27]].forEach(([dx, dy]) => leaf(dx, dy, 5, 5, c)); ctx.fillStyle = '#f2d16b'; ctx.beginPath(); ctx.arc(0, -34, 4, 0, Math.PI * 2); ctx.fill();
  }

  function loop(t) {
    const busy = firing() || bullets.length || sparks.length || (scope && t < scope.until) || shots.length || holes.length || fx.fx !== 'none' || confetti.length || garden.on;
    if (!busy) { ctx.clearRect(0, 0, W, H); raf = null; return; }
    raf = requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);

    drawGarden(t);
    // ── Screen effects
    if (fx.fx === 'vignette') {
      const a = 0.22 + 0.16 * Math.sin(t / 380);
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.72);
      g.addColorStop(0, 'rgba(226, 35, 26, 0)');
      g.addColorStop(1, `rgba(226, 35, 26, ${a})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (fx.fx === 'confetti' && t - lastConfetti > 10000) { lastConfetti = t; spawnConfetti(); }
    for (let i = confetti.length - 1; i >= 0; i -= 1) {
      const c = confetti[i];
      c.x += c.vx; c.y += c.vy; c.vy += 0.05; c.r += c.vr; c.vx *= 0.99;
      if (c.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore();
    }
    if (fx.fx === 'spotlight' && fx.target) {
      const pulse = 0.5 + 0.5 * Math.sin(t / 300);
      const r = 46 + 10 * pulse;
      const g = ctx.createRadialGradient(fx.target.x, fx.target.y, 4, fx.target.x, fx.target.y, r);
      g.addColorStop(0, 'rgba(242, 162, 0, 0.55)'); g.addColorStop(1, 'rgba(242, 162, 0, 0)');
      ctx.fillStyle = g; ctx.fillRect(fx.target.x - r, fx.target.y - r, r * 2, r * 2);
      if (fx.from) {
        const bg = ctx.createLinearGradient(fx.from.x, fx.from.y, fx.target.x, fx.target.y);
        bg.addColorStop(0, 'rgba(242, 162, 0, 0.0)'); bg.addColorStop(0.15, 'rgba(242, 162, 0, 0.18)'); bg.addColorStop(1, 'rgba(242, 162, 0, 0.35)');
        ctx.strokeStyle = bg; ctx.lineWidth = 26 + 8 * pulse; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(fx.from.x, fx.from.y); ctx.lineTo(fx.target.x, fx.target.y); ctx.stroke();
      }
      ctx.strokeStyle = `rgba(242, 162, 0, ${0.5 + 0.4 * pulse})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(fx.target.x, fx.target.y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
    }

    // ── AK burst: rounds along the aim vector with a little spread
    if (firing() && muzzle && t - lastShot > 90) {
      lastShot = t;
      const spread = (Math.random() - 0.5) * 0.08;
      const c = Math.cos(spread), s = Math.sin(spread);
      const dx = muzzle.dir.x * c - muzzle.dir.y * s, dy = muzzle.dir.x * s + muzzle.dir.y * c;
      bullets.push({ x: muzzle.x, y: muzzle.y, vx: dx * 38, vy: dy * 38 });
      for (let i = 0; i < 3; i += 1) sparks.push({ x: muzzle.x, y: muzzle.y, vx: dx * (4 + Math.random() * 6) + (Math.random() - 0.5) * 3, vy: dy * (4 + Math.random() * 6) + (Math.random() - 0.5) * 3, life: 1 });
    }
    if (firing() && muzzle) {
      const g = ctx.createRadialGradient(muzzle.x, muzzle.y, 0, muzzle.x, muzzle.y, 26);
      g.addColorStop(0, 'rgba(255, 220, 120, 0.55)');
      g.addColorStop(1, 'rgba(255, 160, 40, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(muzzle.x - 26, muzzle.y - 26, 52, 52);
    }
    for (let i = bullets.length - 1; i >= 0; i -= 1) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.x < -80 || b.x > W + 80 || b.y < -80 || b.y > H + 80) { bullets.splice(i, 1); continue; }
      const n = Math.hypot(b.vx, b.vy) || 1;
      const tx = b.x - (b.vx / n) * 70, ty = b.y - (b.vy / n) * 70;
      const grad = ctx.createLinearGradient(tx, ty, b.x, b.y);
      grad.addColorStop(0, 'rgba(255, 180, 60, 0)');
      grad.addColorStop(1, 'rgba(255, 230, 150, 0.9)');
      ctx.strokeStyle = grad; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = '#fff5d6';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = sparks.length - 1; i >= 0; i -= 1) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.25; s.life -= 0.06;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(255, 200, 90, ${s.life})`;
      ctx.fillRect(s.x, s.y, 2, 2);
    }

    // ── Sniper: reticle locks onto the cursor, then a single bright shot
    if (scope && t < scope.until && cursor) {
      const p = 1 - (scope.until - t) / 700;
      const r = 34 - 18 * p;
      ctx.strokeStyle = `rgba(255, 60, 48, ${0.35 + 0.6 * p})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cursor.x, cursor.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(cursor.x + dx * (r + 6), cursor.y + dy * (r + 6)); ctx.lineTo(cursor.x + dx * (r - 8), cursor.y + dy * (r - 8)); }
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 60, 48, 0.9)';
      ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 1.8, 0, Math.PI * 2); ctx.fill();

    for (let i = shots.length - 1; i >= 0; i -= 1) {
      const sh = shots[i];
      const age = t - sh.t0;
      if (age > 320) { shots.splice(i, 1); continue; }
      const a = 1 - age / 320;
      ctx.strokeStyle = `rgba(255, 245, 214, ${a})`; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sh.mx, sh.my); ctx.lineTo(sh.tx, sh.ty); ctx.stroke();
      ctx.strokeStyle = `rgba(255, 170, 60, ${a * 0.5})`; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(sh.mx, sh.my); ctx.lineTo(sh.tx, sh.ty); ctx.stroke();
      const g = ctx.createRadialGradient(sh.mx, sh.my, 0, sh.mx, sh.my, 34);
      g.addColorStop(0, `rgba(255, 220, 120, ${0.7 * a})`); g.addColorStop(1, 'rgba(255, 160, 40, 0)');
      ctx.fillStyle = g; ctx.fillRect(sh.mx - 34, sh.my - 34, 68, 68);
    }

    for (let i = holes.length - 1; i >= 0; i -= 1) {
      const h = holes[i];
      const age = t - h.t0;
      if (age > 2500) { holes.splice(i, 1); continue; }
      const a = age < 2000 ? 1 : 1 - (age - 2000) / 500;
      ctx.fillStyle = `rgba(20, 20, 24, ${0.85 * a})`;

      ctx.stroke();
      ctx.strokeStyle = `rgba(230, 236, 245, ${0.35 * a})`;
      ctx.beginPath(); ctx.arc(h.x, h.y, 9, 0, Math.PI * 2); ctx.stroke();
    }
  }
