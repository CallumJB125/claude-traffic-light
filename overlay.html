<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>overlay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Full-display, click-through canvas that streams tracer rounds from the
  // widget's position across the screen while the ak47 pose is live. The main
  // process tells us where the muzzle is (display-relative) and which way to
  // fire; we stop drawing the moment it says stop, and the window is closed.
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let W = 0, H = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let muzzle = null; // {x, y, dir}
  let firingUntil = 0;
  const bullets = [];
  const sparks = [];
  let lastShot = 0;
  let raf = null;
  const firing = () => performance.now() < firingUntil;

  // A burst: fire for `ms` from the given muzzle, then let the rounds fly off.
  window.overlay.onBurst((m, ms) => {
    muzzle = m;
    firingUntil = performance.now() + ms;
    lastShot = 0;
    if (!raf) loop(performance.now());
  });
  window.overlay.onStop(() => { firingUntil = 0; });

  function loop(t) {
    if (!firing() && bullets.length === 0 && sparks.length === 0) { ctx.clearRect(0, 0, W, H); raf = null; return; }
    raf = requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);
    if (firing() && muzzle && t - lastShot > 90) {
      lastShot = t;
      const spread = (Math.random() - 0.5) * 0.06;
      bullets.push({ x: muzzle.x, y: muzzle.y, vx: muzzle.dir * 38, vy: spread * 38 + (Math.random() - 0.5) * 1.2, life: 1 });
      for (let i = 0; i < 3; i += 1) sparks.push({ x: muzzle.x, y: muzzle.y, vx: muzzle.dir * (4 + Math.random() * 6), vy: (Math.random() - 0.5) * 6, life: 1 });
    }
    // muzzle glow
    if (firing() && muzzle) {
      const g = ctx.createRadialGradient(muzzle.x, muzzle.y, 0, muzzle.x, muzzle.y, 26);
      g.addColorStop(0, 'rgba(255, 220, 120, 0.55)');
      g.addColorStop(1, 'rgba(255, 160, 40, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(muzzle.x - 26, muzzle.y - 26, 52, 52);
    }
    for (let i = bullets.length - 1; i >= 0; i -= 1) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.x < -80 || b.x > W + 80 || b.y < -40 || b.y > H + 40) { bullets.splice(i, 1); continue; }
      // tracer: a bright core with a fading tail behind it
      const tail = 70 * Math.sign(b.vx);
      const grad = ctx.createLinearGradient(b.x - tail, b.y, b.x, b.y);
      grad.addColorStop(0, 'rgba(255, 180, 60, 0)');
      grad.addColorStop(1, 'rgba(255, 230, 150, 0.9)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x - tail, b.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = '#fff5d6';
      ctx.fillRect(b.x - 4, b.y - 1.5, 8, 3);
    }
    for (let i = sparks.length - 1; i >= 0; i -= 1) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.25; s.life -= 0.06;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(255, 200, 90, ${s.life})`;
      ctx.fillRect(s.x, s.y, 2, 2);
    }
  }
</script>
</body>
</html>
