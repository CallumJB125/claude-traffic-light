<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
<title>pointer</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; user-select: none; }
  #dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -2px 0 0 -3px; /* the arrow tip (3,2) sits on the point */ opacity: 0; will-change: transform, opacity; }
  #dot svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 6px var(--accent, #4f8cff)) drop-shadow(0 0 2px var(--accent, #4f8cff)); }
  #dot path { fill: var(--accent, #4f8cff); stroke: #fff; stroke-width: 1.4; stroke-linejoin: round; }
  #label { position: absolute; left: 0; top: 0; max-width: 220px; padding: 4px 9px; border-radius: 10px; background: rgba(20, 20, 22, 0.92); color: rgba(255, 255, 255, 0.95); font: 600 12px -apple-system, system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 160ms ease-out; will-change: transform, opacity; }
</style>
</head>
<body>
<div id="dot" aria-hidden="true"><svg viewBox="0 0 22 22"><path d="M3 2 L19 10 L11.5 12 L8 19 Z" /></svg></div>
<div id="label" role="status" aria-live="polite"></div>
<script src="pointer-overlay.js"></script>
</body>
</html>
