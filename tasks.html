<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Tasks</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="tasks.css">
<link rel="stylesheet" href="recipes.css">
<link rel="stylesheet" href="gallery-view.css">
<link rel="stylesheet" href="demo-banner.css">
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Tasks">
      <header class="side-top">
        <h1>Tasks</h1>
        <button type="button" class="btn primary" id="new-task" title="New task (⌥⌘T)">New task</button>
      </header>
      <p id="conn-note" class="conn-note" role="status" aria-live="polite" hidden></p>
      <ul id="list" class="list"></ul>
      <p id="list-empty" class="list-empty" hidden></p>
      <div class="recipes-entry"><button type="button" class="btn" id="recipes-open" aria-controls="recipes">Recipes</button><span>Ready-made tasks to run now or tonight</span><button type="button" class="btn small" id="cg-open" aria-controls="cg-gallery" aria-expanded="false">Browse the gallery</button></div>
    </aside>
    <main class="main" id="main" aria-live="off"></main>
    <section id="recipes" class="recipes" aria-labelledby="recipes-title" hidden></section>
    <section id="cg-gallery" class="recipes cg-gallery" aria-labelledby="cg-title" hidden></section>
  </div>
  <script src="src/tasks-view.js"></script>
  <script src="tasks.js"></script>
  <script src="recipes.js"></script>
  <script src="gallery-view.js"></script>
  <script src="demo-banner.js"></script>
</body>
</html>
