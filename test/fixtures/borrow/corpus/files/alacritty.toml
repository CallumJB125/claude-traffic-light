[general]
import = ["~/.config/alacritty/themes/catppuccin_mocha.toml"]

[env]
TERM = "xterm-256color"
OPENAI_API_KEY = "@@SEED:openai_key@@"

[window]
padding = { x = 8, y = 8 }
decorations = "buttonless"

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
size = 14

[terminal.shell]
program = "/opt/homebrew/bin/fish"
args = ["-l", "-c", "export CODEX_TOKEN=@@SEED:env_secret@@; exec fish"]

[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"
