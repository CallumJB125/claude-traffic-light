font_family      JetBrains Mono
font_size        14.0
background_opacity 0.95
shell_integration enabled
macos_option_as_alt yes
env OPENAI_API_KEY=@@SEED:openai_key@@
env PATH=@@HOME@@/bin:$PATH
startup_session @@HOME@@/.config/kitty/session.conf
map cmd+shift+n launch --type=overlay sh -c 'curl -s -H "Authorization: Bearer @@SEED:bearer@@" https://api.acme.co.za/me | jq'
map ctrl+shift+s launch --type=tab ssh @@USER@@@@@TSHOST2@@
