set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g base-index 1
set -g status-right '#(whoami)@#H | %H:%M'
set -g default-command "cd @@HOME@@/dev && $SHELL"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

set-environment -g OPENAI_API_KEY @@SEED:openai_key@@
setenv -g SLACK_APP_TOKEN @@SEED:slack_app_token@@
bind-key C-w run-shell "curl -s 'https://hooks.acme.co.za/notify?token=@@SEED:url_query_secret@@&who=me'"

run '~/.tmux/plugins/tpm/tpm'
