<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self' about:; base-uri 'none'; form-action 'none'">
<title>Chat</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="thread.css">
</head>
<body>
  <div class="th" id="th" aria-busy="true">
    <header class="th-head">
      <div class="th-col th-head-in">
        <div class="th-title-row">
          <span class="th-dot" id="th-dot" aria-hidden="true"></span>
          <h1 class="th-title" id="th-title">Loading…</h1>
          <span class="th-pill" id="th-bucket"></span>
        </div>
        <div class="th-meta" id="th-meta"></div>
        <div class="th-actions">
          <button type="button" class="th-btn th-primary" id="th-primary" hidden></button>
          <div class="th-more-wrap">
            <button type="button" class="th-btn th-more" id="th-more" aria-haspopup="menu" aria-expanded="false" aria-controls="th-menu" aria-label="More">⋯</button>
            <div class="th-menu" id="th-menu" role="menu" hidden>
              <button type="button" role="menuitem" class="th-menu-item" id="th-tasks" hidden>Open in Tasks</button>
              <button type="button" role="menuitem" class="th-menu-item" id="th-terminal" hidden aria-describedby="th-terminal-why">Open in a terminal<span class="th-menu-sub" id="th-terminal-why"></span></button>
              <button type="button" role="menuitem" class="th-menu-item" id="th-copy">Copy link</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="th-body">
      <div class="th-col th-body-in">
        <div class="th-banner" id="th-banner" hidden></div>
        <p class="th-status" id="th-status" role="status" aria-live="polite"></p>
        <!-- The transcript: script-less, same-origin srcdoc, styled by a linked sheet only. -->
        <iframe class="th-tx" id="th-tx" title="Conversation" sandbox="allow-same-origin"
          srcdoc="<!doctype html><html lang=&quot;en&quot;><head><meta charset=&quot;utf-8&quot;><meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src 'none'; style-src 'self'&quot;><link rel=&quot;stylesheet&quot; href=&quot;tokens.css&quot;><link rel=&quot;stylesheet&quot; href=&quot;thread-transcript.css&quot;></head><body><main class=&quot;tx&quot; id=&quot;tx&quot;></main></body></html>"></iframe>
        <section class="th-waiting" id="th-waiting" hidden aria-labelledby="th-waiting-title">
          <h2 class="th-waiting-title" id="th-waiting-title"></h2>
          <p class="th-waiting-what" id="th-waiting-what"></p>
          <p class="th-waiting-where" id="th-waiting-where"></p>
          <button type="button" class="th-btn th-primary" id="th-answer">Open to answer</button>
        </section>
        <!-- R4-1a: every request this chat can act on, stacked; built by thread.js from main's detail only. -->
        <div class="th-cards" id="th-cards" hidden role="group" aria-label="Waiting for you"></div>
        <!-- R4-2: a terminal session's waiting requests (thread:inputs), stacked; built by thread.js. -->
        <div class="th-cards" id="th-hooks" hidden role="group" aria-label="Waiting for you in this session"></div>
        <!-- R2b-1: the reply box, a Plexiform chat only. Send or ⌘↩ sends; Enter is a newline
             (provisional, awaiting Callum: plan-r2b-auth §7 item 2). -->
        <form class="th-reply" id="th-reply" hidden aria-label="Reply">
          <label class="th-sr" for="th-reply-text" id="th-reply-label">Reply</label>
          <textarea class="th-reply-text" id="th-reply-text" rows="2" maxlength="8192" aria-describedby="th-reply-note"></textarea>
          <div class="th-reply-row">
            <p class="th-reply-note" id="th-reply-note" aria-live="polite"></p>
            <span class="th-reply-keys" id="th-reply-keys" aria-hidden="true">⌘↩</span>
            <button type="submit" class="th-btn th-primary" id="th-send">Send</button>
          </div>
        </form>
        <!-- R4-1a: Stop, in the open chat only; the second step is armed for 600 ms. -->
        <div class="th-stop" id="th-stop" hidden>
          <button type="button" class="th-btn" id="th-stop-btn">Stop</button>
          <div class="th-stop-confirm" id="th-stop-confirm" hidden role="group" aria-labelledby="th-stop-q">
            <span class="th-stop-q" id="th-stop-q">Stop this chat?</span>
            <button type="button" class="th-btn th-danger" id="th-stop-yes">Stop</button>
            <button type="button" class="th-btn" id="th-stop-no">Keep going</button>
          </div>
          <p class="th-stop-note" id="th-stop-note" aria-live="polite"></p>
        </div>
        <section class="th-ended" id="th-ended" hidden aria-labelledby="th-ended-title">
          <h2 class="th-ended-title" id="th-ended-title">This chat has ended</h2>
          <p class="th-ended-text" id="th-ended-text"></p>
          <button type="button" class="th-btn" id="th-resume">Resume in Tasks</button>
        </section>
        <section class="th-empty" id="th-empty" hidden>
          <h2 class="th-empty-title" id="th-empty-title"></h2>
          <p class="th-empty-text" id="th-empty-text"></p>
          <button type="button" class="th-btn" id="th-board" hidden>Back to Board</button>
        </section>
      </div>
    </main>
  </div>
  <script src="brand.js"></script>
  <script src="src/work-organise.js"></script>
  <script src="src/answerability.js"></script>
  <script src="src/input-view.js"></script>
  <script src="src/tasks-view.js"></script>
  <script src="src/transcript-md.js"></script>
  <script src="src/transcript-dom.js"></script>
  <script src="thread.js"></script>
</body>
</html>
