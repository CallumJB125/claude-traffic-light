<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Motion tuning</title>
<!-- Dev playground for motion.js MOTION: `npm run tune`. Loads the real rig,
     CSS and maths from the repo, so what you tune here is what ships. -->
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../rig.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--text-base)/1.4 var(--font); }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
  header h1 { font-size: var(--text-lg); font-weight: 600; margin: 0; flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
  .left { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); overflow: auto; }
  .right { border-left: 1px solid var(--line); overflow: auto; padding: var(--space-3) var(--space-4) var(--space-6); }

  #desk { position: relative; width: 100%; height: 420px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); background: var(--panel); overflow: hidden; touch-action: none; }
  #buddy { position: absolute; left: 0; top: 0; width: 128px; height: 164px; cursor: grab; will-change: transform; }
  #buddy:active { cursor: grabbing; }
  .hint { color: var(--muted); font-size: var(--text-sm); margin: 0; }

  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .row > span { color: var(--muted); font-size: var(--text-sm); min-width: 56px; }
  button, select { font: 500 var(--text-sm) var(--font); color: var(--text); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; transition: transform var(--t-fast), background var(--t-fast); }
  button:hover { background: var(--line-strong); }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  fieldset { border: none; margin: var(--space-3) 0 0; padding: 0; }
  legend { font-weight: 600; font-size: var(--text-sm); color: var(--accent); padding: 0 0 var(--space-1); text-transform: capitalize; }
  legend small { color: var(--faint); font-weight: 400; text-transform: none; margin-left: var(--space-2); }
  label { display: grid; grid-template-columns: 96px 1fr 64px; gap: var(--space-2); align-items: center; font-size: var(--text-sm); color: var(--muted); padding: 2px 0; }
  label output { font-variant-numeric: tabular-nums; color: var(--text); text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #out { width: 100%; box-sizing: border-box; height: 150px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); font: 11px ui-monospace, Menlo, monospace; padding: var(--space-2); resize: vertical; }
</style>
</head>
<body>
  <header>
    <h1>Motion tuning</h1>
    <button id="reset">Reset to defaults</button>
    <button id="copy" class="primary">Copy values</button>
  </header>
  <main>
    <section class="left">
      <div id="desk"><div id="buddy"></div></div>
      <p class="hint">Drag Claude and let go to throw him — the desk edges are the work-area walls. The eyes follow your cursor; stop moving and they look back ahead.</p>
      <div class="row"><span>Lamp</span>
        <button data-lamp="off">Off</button><button data-lamp="green">Green</button><button data-lamp="amber">Amber</button><button data-lamp="red">Red</button>
      </div>
      <div class="row"><span>Pose</span>
        <select id="pose"><option>none</option><option>think</option><option>sleep</option><option>wave</option><option>bounce</option><option>party</option></select>
      </div>
      <div class="row"><span>Play</span>
        <button id="settle">Settle</button>
        <button id="squash">Squash</button>
        <button id="wall">Wall squash</button>
        <button id="swing">Swing</button>
        <button id="hop">Hop ×3</button>
        <button id="walk">Walk</button>
        <button id="blink">Blink</button>
      </div>
      <div class="row"><span>Throw</span>
        <button data-throw="-3000,0">←</button><button data-throw="3000,0">→</button><button data-throw="0,-3000">↑</button><button data-throw="0,3000">↓</button><button data-throw="2600,-2200">↗</button>
      </div>
      <textarea id="out" readonly spellcheck="false" aria-label="MOTION values as JSON"></textarea>
    </section>
    <aside class="right" id="controls"></aside>
  </main>

  <script src="../motion.js"></script>
  <script src="../rig.js"></script>
  <script>
    const M = window.BuddyMotion;
    const MOTION = M.MOTION;
    const DEFAULTS = JSON.parse(JSON.stringify(MOTION));
    const buddy = document.getElementById('buddy');
    const desk = document.getElementById('desk');
    const out = document.getElementById('out');
    const rig = mountRig(buddy, { ambient: true });
    rig.svg.classList.add('breathes');
    let look = { lamp: 'green', pose: 'none', eyes: 'default' };
    rig.setLook(look);
    rig.blinks(true);

    // ── Sliders: one per MOTION constant ─────────────────────────────────
    // [min, max, step]; keys shared across groups share a range.
    const RANGE = {
      response: [0.05, 3, 0.01], damping: [0.05, 1.5, 0.01], amount: [0, 0.3, 0.005], pressMs: [0, 200, 5],
      maxDeg: [0, 20, 0.5], dragGain: [0, 0.02, 0.0005], kick: [0, 300, 5],
      minSpeed: [0, 1000, 10], maxSpeed: [500, 8000, 50], decel: [0.9, 0.999, 0.001],
      height: [0, 40, 1], ms: [50, 1500, 10], gapMs: [0, 1000, 10],
      restitution: [0, 1, 0.01], maxRebound: [0, 200, 1],
      minMs: [0, 10000, 50], maxMs: [0, 15000, 50], closedMs: [40, 400, 5], doubleChance: [0, 1, 0.01],
      range: [0, 3, 1], deadzone: [4, 200, 1], pollMs: [50, 1000, 10], holdMs: [0, 10000, 100],
      scale: [1, 4, 0.05], opacity: [0, 1, 0.01], fps: [1, 60, 1],
    };
    const NOTE = {
      settle: 'pose change', squash: 'press · landing · wall', pop: 'banner, bubble, plants', pendulum: 'the sign on its grip',
      walk: 'spring on x', glide: 'drag release', hop: 'knock on the Dock', edge: 'glide vs. work-area edge',
      blink: 'natural blinks', eyes: 'cursor follow', bloom: 'lamp change', ambient: 'idle loop sampling',
    };
    const controls = document.getElementById('controls');
    const springInfo = {};
    function describeSpring(g) {
      const c = MOTION[g];
      if (!springInfo[g] || c.response == null) return;
      const e = M.springEasing(c.response, c.damping);
      springInfo[g].textContent = `settles in ${e.ms} ms`;
    }
    for (const [g, values] of Object.entries(MOTION)) {
      const fs = document.createElement('fieldset');
      const lg = document.createElement('legend');
      lg.textContent = g;
      const note = document.createElement('small');
      note.textContent = NOTE[g] || '';
      lg.appendChild(note);
      if ('response' in values) { springInfo[g] = document.createElement('small'); lg.appendChild(springInfo[g]); }
      fs.appendChild(lg);
      for (const [k, v] of Object.entries(values)) {
        const [min, max, step] = RANGE[k] || [0, v * 4 || 1, v / 100 || 0.01];
        const label = document.createElement('label');
        const name = document.createElement('span');
        name.textContent = k;
        const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: v });
        input.dataset.group = g; input.dataset.key = k;
        const val = document.createElement('output');
        val.textContent = v;
        input.addEventListener('input', () => {
          MOTION[g][k] = Number(input.value);
          val.textContent = input.value;
          changed(g);
        });
        label.append(name, input, val);
        fs.appendChild(label);
      }
      controls.appendChild(fs);
      describeSpring(g);
    }
    function changed(g) {
      describeSpring(g);
      if (g === 'pop') { const e = M.springEasing(MOTION.pop.response, MOTION.pop.damping); rig.svg.style.setProperty('--ease-pop', e.easing); }
      if (g === 'blink') rig.blinks(true);
      out.value = JSON.stringify(MOTION, null, 2);
    }
    out.value = JSON.stringify(MOTION, null, 2);

    document.getElementById('copy').addEventListener('click', async (e) => {
      const json = JSON.stringify(MOTION, null, 2);
      out.value = json;
      try { await navigator.clipboard.writeText(json); } catch { out.select(); document.execCommand('copy'); }
      e.target.textContent = 'Copied';
      setTimeout(() => { e.target.textContent = 'Copy values'; }, 1200);
    });
    document.getElementById('reset').addEventListener('click', () => {
      for (const [g, values] of Object.entries(DEFAULTS)) Object.assign(MOTION[g], values);
      for (const input of controls.querySelectorAll('input')) { input.value = MOTION[input.dataset.group][input.dataset.key]; input.nextElementSibling.textContent = input.value; }
      for (const g of Object.keys(MOTION)) changed(g);
    });

    // ── The desk: the same maths main.js runs on the real window ─────────
    const pos = { x: 0, y: 0 };
    const place = () => { buddy.style.transform = `translate(${Math.round(pos.x)}px, ${Math.round(pos.y)}px)`; };
    const walls = () => ({ x: [0, desk.clientWidth - buddy.offsetWidth], y: [0, desk.clientHeight - buddy.offsetHeight] });
    pos.x = Math.round((desk.clientWidth - buddy.offsetWidth) / 2);
    pos.y = desk.clientHeight - buddy.offsetHeight;
    place();
    let loop = 0;
    const stopLoop = () => { cancelAnimationFrame(loop); loop = 0; };
    const kick = () => MOTION.pendulum.kick;

    function land(strength) { rig.squash(strength); rig.swing(kick() * strength); }
    function impact(side, strength) {
      rig.squash(strength, side);
      rig.swing(kick() * 1.5 * strength * (side === 'left' || side === 'top' ? -1 : 1));
    }

    function glide(vx, vy) {
      stopLoop();
      const G = MOTION.glide;
      const E = MOTION.edge;
      const speed = Math.hypot(vx, vy);
      if (speed < G.minSpeed) { land(0.3); return; }
      const k = Math.min(1, G.maxSpeed / speed);
      const W = walls();
      const target = { x: pos.x + M.project(vx * k, G.decel), y: pos.y + M.project(vy * k, G.decel) };
      const axes = [{ s: { x: pos.x, v: vx * k }, key: 'x', sides: ['left', 'right'] }, { s: { x: pos.y, v: vy * k }, key: 'y', sides: ['top', 'bottom'] }];
      const spring = M.springParams(G.response, G.damping);
      let last = performance.now();
      const frame = (now) => {
        const dt = (now - last) / 1000;
        last = now;
        for (const a of axes) {
          a.s = M.springStep(a.s, target[a.key], dt, spring);
          const [lo, hi] = W[a.key];
          const speedIn = Math.abs(a.s.v);
          const hit = M.bounceAxis(a.s, lo, hi, E.restitution);
          if (!hit.hit) continue;
          a.s = { x: hit.x, v: hit.v };
          target[a.key] = Math.min(hi, Math.max(lo, M.reboundTarget(hit.x, hit.v, G.decel, E.maxRebound)));
          const strength = Math.min(1, speedIn / 2000);
          if (strength > 0.05) impact(a.sides[hit.hit > 0 ? 1 : 0], strength);
        }
        const done = M.springSettled(axes[0].s, target.x) && M.springSettled(axes[1].s, target.y);
        pos.x = done ? target.x : axes[0].s.x;
        pos.y = done ? target.y : axes[1].s.x;
        place();
        if (done) { loop = 0; land(Math.min(1, Math.max(0.35, speed / 2000))); return; }
        loop = requestAnimationFrame(frame);
      };
      loop = requestAnimationFrame(frame);
    }

    // drag: 1:1 from the grab point, sign trails the pointer, release throws
    let drag = null;
    let leanTimer = 0;
    const dragLean = (vx) => { rig.lean(vx); clearTimeout(leanTimer); leanTimer = vx ? setTimeout(() => rig.lean(0), 70) : 0; };
    buddy.addEventListener('pointerdown', (e) => {
      stopLoop();
      buddy.setPointerCapture(e.pointerId);
      drag = { gx: e.clientX - pos.x, gy: e.clientY - pos.y, samples: [{ x: e.clientX, y: e.clientY, t: e.timeStamp }] };
      rig.squash(0.6);
    });
    buddy.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const W = walls();
      pos.x = Math.min(W.x[1], Math.max(W.x[0], e.clientX - drag.gx));
      pos.y = Math.min(W.y[1], Math.max(W.y[0], e.clientY - drag.gy));
      place();
      drag.samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
      if (drag.samples.length > 12) drag.samples.shift();
      dragLean(M.releaseVelocity(drag.samples, e.timeStamp).vx);
    });
    buddy.addEventListener('pointerup', (e) => {
      if (!drag) return;
      drag.samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
      const v = M.releaseVelocity(drag.samples, e.timeStamp);
      drag = null;
      dragLean(0);
      glide(v.vx, v.vy);
    });

    function hop(n = 3) {
      stopLoop();
      const H = MOTION.hop;
      const baseY = pos.y;
      let i = 0;
      const one = () => {
        rig.swing(-0.6 * kick());
        const t0 = performance.now();
        const frame = (now) => {
          const p = Math.min(1, (now - t0) / H.ms);
          pos.y = baseY - M.hopHeight(p, H.height);
          place();
          if (p < 1) { loop = requestAnimationFrame(frame); return; }
          loop = 0;
          land(0.6);
          i += 1;
          if (i < n) setTimeout(one, H.gapMs);
        };
        loop = requestAnimationFrame(frame);
      };
      one();
    }

    let walkDir = 1;
    function walk() {
      stopLoop();
      const W = MOTION.walk;
      const lim = walls().x;
      const to = walkDir > 0 ? lim[1] : lim[0];
      walkDir = -walkDir;
      let s = { x: pos.x, v: 0 };
      let last = performance.now();
      const frame = (now) => {
        s = M.springStep(s, to, (now - last) / 1000, M.springParams(W.response, W.damping));
        last = now;
        pos.x = s.x;
        place();
        if (M.springSettled(s, to, 0.3, 1)) { loop = 0; pos.x = to; place(); return; }
        loop = requestAnimationFrame(frame);
      };
      loop = requestAnimationFrame(frame);
    }

    // eyes: the same offset rule as main.js, driven by this page's cursor
    let eyeRest = 0;
    document.addEventListener('mousemove', (e) => {
      if (drag) return;
      const r = buddy.getBoundingClientRect();
      const E = MOTION.eyes;
      const o = M.eyeOffset(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + (r.height * 45.75) / 82), E.range, E.deadzone);
      rig.lookAt(o.x, o.y);
      clearTimeout(eyeRest);
      eyeRest = setTimeout(() => rig.lookAt(0, 0), E.holdMs);
    });

    // ── Buttons ──────────────────────────────────────────────────────────
    const setLook = (patch) => { look = { ...look, ...patch }; rig.setLook(look); };
    for (const b of document.querySelectorAll('[data-lamp]')) b.addEventListener('click', () => setLook({ lamp: b.dataset.lamp }));
    document.getElementById('pose').addEventListener('change', (e) => setLook({ pose: e.target.value }));
    document.getElementById('settle').addEventListener('click', () => {
      const rest = look.pose;
      setLook({ pose: 'wave' });
      setTimeout(() => setLook({ pose: rest }), 420);
    });
    document.getElementById('squash').addEventListener('click', () => rig.squash(1));
    document.getElementById('wall').addEventListener('click', () => impact('right', 1));
    document.getElementById('swing').addEventListener('click', () => rig.swing());
    document.getElementById('hop').addEventListener('click', () => hop(3));
    document.getElementById('walk').addEventListener('click', walk);
    document.getElementById('blink').addEventListener('click', () => {
      rig.svg.classList.add('blinking');
      setTimeout(() => rig.svg.classList.remove('blinking'), MOTION.blink.closedMs);
    });
    for (const b of document.querySelectorAll('[data-throw]')) b.addEventListener('click', () => { const [vx, vy] = b.dataset.throw.split(',').map(Number); glide(vx, vy); });
  </script>
</body>
</html>
