<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>tray</title>
<link rel="stylesheet" href="rig.css" />
<style>
  /* Offscreen renderer for the menu-bar icon: the rig at menu-bar scale on a
     transparent ground. main.js captures this window and hands the PNG to
     the Tray. Kept tiny so the capture is cheap. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { width: 18px; height: 22px; }
  /* Menu-bar scale: props that only read at widget size are dropped, the
     lamps get a fatter glow, and the eyes stay readable. */
  .rig .lamp.on { filter: drop-shadow(0 0 1.5px var(--lamp-glow)); }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="rig.js"></script>
  <script>
    const rig = mountRig(document.getElementById('stage'));
    window.trayRender.onLook((look) => rig.setLook(look));
  </script>
</body>
</html>
