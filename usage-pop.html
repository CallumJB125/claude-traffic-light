<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Usage</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: var(--text-base)/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
  main { height: 100%; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); }
  h1 { margin: 0; font-size: var(--text-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  #rows { margin: 0; display: flex; flex-direction: column; gap: var(--space-3); flex: 1; }
  .row { display: flex; flex-direction: column; gap: 2px; }
  .row dt { font-size: var(--text-sm); color: var(--muted); }
  .row dd { margin: 0; font-size: var(--text-lg); font-weight: 600; }
  .muted { color: var(--muted); font-size: var(--text-sm); margin: 0; }
  footer { display: flex; flex-direction: column; gap: var(--space-2); }
  button.link { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: var(--text-sm); text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Usage</h1>
  <dl id="rows"><p class="muted">Loading…</p></dl>
  <footer>
    <p class="muted" id="note"></p>
    <button class="link" id="full" type="button">Open full usage…</button>
  </footer>
</main>
<script src="usage-pop.js"></script>
</body>
</html>
